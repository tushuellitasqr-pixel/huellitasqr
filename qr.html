<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HUELLITAS QR</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f5f5f5;
      color: #333;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      font-size: 17px;
    }

    input {
      width: 280px;
      max-width: 90%;
      padding: 12px;
      font-size: 18px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      margin: 10px 5px;
      padding: 12px 22px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    #qr {
      margin: 30px auto 20px;
      width: 236px;
    }

    #descargar {
      display: none;
    }

    #enlace {
      word-break: break-all;
      max-width: 500px;
      margin: 20px auto;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>🐾 HUELLITAS QR</h1>

  <p>Escribe el ID de la mascota</p>

  <input
    type="text"
    id="idMascota"
    placeholder="Ejemplo: HUELL0001"
  >

  <br>

  <button onclick="generarQR()">
    Generar QR
  </button>

  <div id="qr"></div>

  <button id="descargar" onclick="descargarQR()">
    Descargar QR
  </button>

  <div id="enlace"></div>

  <script>

    const TAMANO_QR = 236;

    function generarQR() {

      const id =
        document.getElementById("idMascota")
        .value
        .trim()
        .toUpperCase();

      if (!id) {
        alert("Escribe el ID de la mascota");
        return;
      }

      const enlace =
        "https://tushuellitasqr-pixel.github.io/huellitasqr/?id="
        + encodeURIComponent(id);

      const contenedor =
        document.getElementById("qr");

      contenedor.innerHTML = "";

      new QRCode(
        contenedor,
        {
          text: enlace,
          width: TAMANO_QR,
          height: TAMANO_QR,
          correctLevel: QRCode.CorrectLevel.H
        }
      );

      document.getElementById("enlace").innerHTML =
        "<strong>ID:</strong> " + id +
        "<br><br>" +
        "<strong>Enlace:</strong><br>" + enlace;

      document.getElementById("descargar").style.display =
        "inline-block";
    }


    function descargarQR() {

      const id =
        document.getElementById("idMascota")
        .value
        .trim()
        .toUpperCase();

      const canvas =
        document.querySelector("#qr canvas");

      if (!canvas) {
        alert("Primero genera el QR");
        return;
      }

      const enlace =
        document.createElement("a");

      enlace.download =
        id + "_QR_20mm.png";

      enlace.href =
        canvas.toDataURL("image/png");

      enlace.click();
    }

  </script>

</body>
</html>
