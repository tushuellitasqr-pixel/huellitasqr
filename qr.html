<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HUELLITAS QR</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f5f5f5;
      color: #333;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      font-size: 17px;
    }

    input {
      width: 280px;
      max-width: 90%;
      padding: 12px;
      font-size: 18px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      margin: 10px 5px;
      padding: 12px 22px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    #zonaQR {
      position: relative;
      width: 236px;
      height: 236px;
      margin: 30px auto 20px;
    }

    #qr {
      width: 236px;
      height: 236px;
    }

    #logoCentro {
      position: absolute;
      width: 64px;
      height: 64px;
      left: 86px;
      top: 86px;
      object-fit: contain;
      background: white;
      padding: 6px;
      border-radius: 8px;
      box-sizing: border-box;
      display: none;
      z-index: 10;
    }

    #descargar {
      display: none;
    }

    #enlace {
      word-break: break-all;
      max-width: 500px;
      margin: 20px auto;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>🐾 HUELLITAS QR</h1>

  <p>Escribe el ID de la mascota</p>

  <input
    type="text"
    id="idMascota"
    placeholder="Ejemplo: HUELL0001"
  >

  <br>

  <button onclick="generarQR()">
    Generar QR
  </button>

  <div id="zonaQR">

    <div id="qr"></div>

    <img
      id="logoCentro"
      src="https://tushuellitasqr-pixel.github.io/huellitasqr/logo%20qr.jpg"
      alt="Logo Huellitas QR"
    >

  </div>

  <button id="descargar" onclick="descargarQR()">
    Descargar QR
  </button>

  <div id="enlace"></div>

  <script>

    const TAMANO_QR = 236;

    const URL_LOGO =
      "https://tushuellitasqr-pixel.github.io/huellitasqr/logo%20qr.jpg";


    function generarQR() {

      const id =
        document
        .getElementById("idMascota")
        .value
        .trim()
        .toUpperCase();

      if (!id) {
        alert("Escribe el ID de la mascota");
        return;
      }

      const enlace =
        "https://tushuellitasqr-pixel.github.io/huellitasqr/?id="
        + encodeURIComponent(id);

      const contenedor =
        document.getElementById("qr");

      contenedor.innerHTML = "";

      new QRCode(
        contenedor,
        {
          text: enlace,
          width: TAMANO_QR,
          height: TAMANO_QR,
          correctLevel: QRCode.CorrectLevel.H
        }
      );

      const logo =
        document.getElementById("logoCentro");

      logo.src = URL_LOGO;

      logo.onload = function() {
        logo.style.display = "block";
      };

      logo.onerror = function() {
        logo.style.display = "none";
      };

      document.getElementById("enlace").innerHTML =
        "<strong>ID:</strong> " + id +
        "<br><br>" +
        "<strong>Enlace:</strong><br>" +
        enlace;

      document.getElementById("descargar").style.display =
        "inline-block";
    }


    function descargarQR() {

      const id =
        document
        .getElementById("idMascota")
        .value
        .trim()
        .toUpperCase();

      if (!id) {
        alert("Escribe el ID de la mascota");
        return;
      }

      const qrCanvas =
        document.querySelector("#qr canvas");

      if (!qrCanvas) {
        alert("Primero genera el QR");
        return;
      }

      const logo =
        document.getElementById("logoCentro");

      const canvas =
        document.createElement("canvas");

      const margen = 20;

      canvas.width =
        TAMANO_QR + margen * 2;

      canvas.height =
        TAMANO_QR + margen * 2;

      const ctx =
        canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        qrCanvas,
        margen,
        margen,
        TAMANO_QR,
        TAMANO_QR
      );

      /*
        Espacio blanco detrás del logo
      */

      const centroX =
        canvas.width / 2;

      const centroY =
        canvas.height / 2;

      const fondoLogo = 78;

      ctx.fillStyle = "#ffffff";

      ctx.fillRect(
        centroX - fondoLogo / 2,
        centroY - fondoLogo / 2,
        fondoLogo,
        fondoLogo
      );

      /*
        Logo central
      */

      if (
        logo.complete &&
        logo.naturalWidth > 0
      ) {

        const tamanoLogo = 64;

        ctx.drawImage(
          logo,
          centroX - tamanoLogo / 2,
          centroY - tamanoLogo / 2,
          tamanoLogo,
          tamanoLogo
        );
      }

      /*
        Descargar
      */

      const enlace =
        document.createElement("a");

      enlace.download =
        id + "_QR_20mm.png";

      enlace.href =
        canvas.toDataURL("image/png");

      document.body.appendChild(enlace);

      enlace.click();

      document.body.removeChild(enlace);
    }

  </script>

</body>
</html>
