<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUELLITAS QR</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f5f5f5;
    }

    h1 {
      color: #333;
    }

    input {
      width: 280px;
      padding: 12px;
      font-size: 18px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #qr {
      margin: 30px auto;
      width: 256px;
    }

    #enlace {
      word-break: break-all;
      max-width: 500px;
      margin: 20px auto;
    }
  </style>
</head>

<body>

  <h1>🐾 HUELLITAS QR</h1>

  <p>Escribe el ID de la mascota</p>

  <input
    type="text"
    id="idMascota"
    placeholder="Ejemplo: HUELL0001"
  >

  <br>

  <button onclick="generarQR()">
    Generar QR
  </button>

  <div id="qr"></div>

  <div id="enlace"></div>

  <script>
    function generarQR() {

      const id =
        document.getElementById("idMascota")
        .value
        .trim()
        .toUpperCase();

      if (!id) {
        alert("Escribe el ID de la mascota");
        return;
      }

      const enlace =
        "https://tushuellitasqr-pixel.github.io/huellitasqr/?id="
        + encodeURIComponent(id);

      document.getElementById("qr").innerHTML = "";

      new QRCode(
        document.getElementById("qr"),
        {
          text: enlace,
          width: 256,
          height: 256
        }
      );

      document.getElementById("enlace").innerHTML =
        "<strong>Enlace:</strong><br>" + enlace;
    }
  </script>

</body>
</html>
