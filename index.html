<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HUELLITAS QR</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f6;
      color: #263238;
    }


    /* =========================
       BANNER
       ANCHO COMPLETO
       ALTO REDUCIDO
    ========================= */

    .banner {
      width: 100%;
      height: 33.33vw;
      max-height: 180px;
      background: white;
      overflow: hidden;
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }


    /* =========================
       CONTENEDOR PRINCIPAL
    ========================= */

    .pagina {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 32px 18px 45px;
    }


    /* =========================
       ENCABEZADO
    ========================= */

    .encabezado {
      text-align: center;
      margin-bottom: 22px;
    }

    .huella {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .titulo {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      color: #263238;
    }

    .subtitulo {
      margin: 7px 0 0;
      font-size: 14px;
      color: #718096;
    }


    /* =========================
       TARJETA PRINCIPAL
    ========================= */

    .tarjeta {
      background: #ffffff;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 8px 28px rgba(38, 50, 56, 0.09);
    }


    /* =========================
       FOTO
    ========================= */

    .foto-contenedor {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    #foto {
      width: 100%;
      max-width: 390px;
      height: 330px;
      object-fit: cover;
      border-radius: 20px;
      display: block;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
    }


    /* =========================
       NOMBRE DE LA MASCOTA
    ========================= */

    .nombre-mascota {
      text-align: center;
      margin-bottom: 18px;
    }

    .nombre-mascota h2 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      color: #263238;
      text-transform: capitalize;
    }

    .especie {
      display: inline-block;
      margin-top: 8px;
      padding: 7px 15px;
      border-radius: 30px;
      background: #eef7f3;
      color: #26735a;
      font-size: 14px;
      font-weight: bold;
    }


    /* =========================
       ESTADO
    ========================= */

    .estado-contenedor {
      text-align: center;
      margin-bottom: 22px;
    }

    .estado {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 30px;
      background: #e7f7ed;
      color: #28794a;
      font-size: 13px;
      font-weight: bold;
    }

    .punto {
      width: 8px;
      height: 8px;
      background: #35a866;
      border-radius: 50%;
      display: inline-block;
    }


    /* =========================
       DATOS
    ========================= */

    .datos {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .dato {
      background: #f7f9f8;
      border: 1px solid #edf1ef;
      border-radius: 15px;
      padding: 15px 16px;
      text-align: left;
    }

    .dato-etiqueta {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #7a8784;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }

    .dato-valor {
      display: block;
      font-size: 16px;
      color: #263238;
      line-height: 1.4;
    }


    /* =========================
       BOTONES
    ========================= */

    .botones {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 22px;
    }

    .boton {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 13px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      transition: transform 0.15s ease;
    }

    .boton:active {
      transform: scale(0.98);
    }

    .telefono {
      background: #37474f;
    }

    .whatsapp {
      background: #25d366;
    }

    .audio {
      background: #6c5ce7;
    }


    /* =========================
       CÓDIGO
    ========================= */

    .codigo {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #929c99;
      letter-spacing: 0.5px;
    }


    /* =========================
       PIE DE PÁGINA
    ========================= */

    .pie {
      text-align: center;
      margin-top: 25px;
      color: #899390;
      font-size: 12px;
      line-height: 1.5;
    }

    .pie strong {
      color: #52605c;
    }


    /* =========================
       ERROR
    ========================= */

    .error {
      background: white;
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
      color: #b00020;
      font-weight: bold;
      line-height: 1.6;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
    }


    /* =========================
       CARGANDO
    ========================= */

    .cargando {
      text-align: center;
      padding: 40px 20px;
      color: #718096;
    }


    /* =========================
       CELULARES
    ========================= */

    @media (max-width: 480px) {

      .banner {
        height: 33.33vw;
        max-height: 120px;
      }

      .pagina {
        padding: 26px 12px 35px;
      }

      .tarjeta {
        padding: 16px;
        border-radius: 20px;
      }

      #foto {
        height: 290px;
        border-radius: 17px;
      }

      .nombre-mascota h2 {
        font-size: 28px;
      }

      .dato {
        padding: 13px 14px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       BANNER DE HUELLITAS QR
  ========================== -->

  <div class="banner">

    <img
      src="https://tushuellitasqr-pixel.github.io/huellitasqr/banner.jpg"
      alt="Huellitas QR"
    >

  </div>


  <!-- =========================
       CONTENIDO
  ========================== -->

  <main class="pagina">

    <div id="contenido">

      <div class="cargando">
        🐾<br><br>
        Cargando información...
      </div>

    </div>


    <div class="pie">

      <strong>HUELLITAS QR</strong><br>

      Identificación que ayuda a mantener
      a las mascotas cerca de quienes las quieren.

    </div>

  </main>



<script>


/* =========================
   API DE MASCOTAS
========================= */

const API_MASCOTAS =
  "https://pastesheet.com/api/rbgtavcc";



/* =========================
   CONVERTIR FOTO DE DRIVE
========================= */

function convertirGoogleDrive(url) {

  if (!url) return "";

  url = String(url).trim();


  const coincidencia =
    url.match(/[?&]id=([^&]+)/);


  if (coincidencia) {

    return "https://drive.google.com/thumbnail?id="
      + coincidencia[1]
      + "&sz=w1000";

  }


  const coincidencia2 =
    url.match(/\/d\/([^/]+)/);


  if (coincidencia2) {

    return "https://drive.google.com/thumbnail?id="
      + coincidencia2[1]
      + "&sz=w1000";

  }


  return url;

}



/* =========================
   FORMATEAR FECHA
========================= */

function formatearFecha(valor) {

  if (!valor) return "";

  const texto =
    String(valor).trim();


  if (
    /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(texto)
  ) {

    return texto;

  }


  if (texto.includes("-")) {

    const fecha =
      new Date(texto);


    if (!isNaN(fecha.getTime())) {

      return fecha.toLocaleDateString("es-EC");

    }

  }


  const numero =
    Number(texto);


  if (!isNaN(numero)) {

    const fechaBase =
      new Date(Date.UTC(1899, 11, 30));


    fechaBase.setUTCDate(
      fechaBase.getUTCDate()
      + Math.floor(numero)
    );


    return fechaBase.toLocaleDateString(
      "es-EC",
      {
        timeZone: "UTC"
      }
    );

  }


  return texto;

}



/* =========================
   OBTENER ID
========================= */

const parametros =
  new URLSearchParams(
    window.location.search
  );


const idBuscado =
  (parametros.get("id") || "")
  .trim()
  .toUpperCase();



/* =========================
   CARGAR MASCOTA
========================= */

async function cargarMascota() {


  const contenido =
    document.getElementById("contenido");


  if (!idBuscado) {

    contenido.innerHTML = `

      <div class="error">

        No se indicó el código
        de la mascota.

      </div>

    `;

    return;

  }



  try {


    const respuesta =
      await fetch(
        API_MASCOTAS,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        "HTTP " + respuesta.status
      );

    }



    const texto =
      await respuesta.text();



    let datosMascotas;


    try {

      datosMascotas =
        JSON.parse(texto);

    }

    catch (error) {

      throw new Error(
        "La respuesta de PasteSheet no es JSON válido."
      );

    }



    if (
      !datosMascotas ||
      !Array.isArray(datosMascotas.data)
    ) {

      throw new Error(
        "La respuesta no contiene la estructura data."
      );

    }



    const mascotas =
      datosMascotas.data;



    const mascota =
      mascotas.find(
        function(animal) {


          const id =
            String(
              animal.ID || ""
            )
            .trim()
            .toUpperCase();


          return id === idBuscado;

        }
      );



    if (!mascota) {

      contenido.innerHTML = `

        <div class="error">

          No se encontró una mascota
          con el código ${idBuscado}.

        </div>

      `;

      return;

    }



    /* =========================
       DATOS
    ========================= */

    const nombre =
      mascota["Nombre de la mascota"] || "";


    const especie =
      mascota["Especie"] || "";


    const color =
      mascota["Color y características"] || "";


    const responsable =
      mascota["Nombre del responsable"] || "";


    const telefono =
      mascota["Teléfono de contacto"] || "";


    const whatsapp =
      mascota["WhatsApp"] || "";


    const foto =
      mascota["Foto de la mascota"] || "";


    const audio =
      mascota["Audio"] || "";


    const fecha =
      mascota["Fecha de registro"] || "";


    const estado =
      mascota["Estado"] || "";



    /* =========================
       FOTO
    ========================= */

    let fotoHTML = "";


    if (foto) {

      fotoHTML = `

        <div class="foto-contenedor">

          <img
            id="foto"
            src="${convertirGoogleDrive(foto)}"
            alt="Foto de ${nombre}"
          >

        </div>

      `;

    }



    /* =========================
       ESPECIE
    ========================= */

    let especieHTML = "";


    if (especie) {

      especieHTML = `

        <span class="especie">
          ${especie}
        </span>

      `;

    }



    /* =========================
       ESTADO
    ========================= */

    let estadoHTML = "";


    if (estado) {

      estadoHTML = `

        <div class="estado-contenedor">

          <span class="estado">

            <span class="punto"></span>

            ${estado}

          </span>

        </div>

      `;

    }



    /* =========================
       DATOS
    ========================= */

    let colorHTML = "";


    if (color) {

      colorHTML = `

        <div class="dato">

          <span class="dato-etiqueta">
            Características
          </span>

          <span class="dato-valor">
            ${color}
          </span>

        </div>

      `;

    }



    let responsableHTML = "";


    if (responsable) {

      responsableHTML = `

        <div class="dato">

          <span class="dato-etiqueta">
            Responsable
          </span>

          <span class="dato-valor">
            ${responsable}
          </span>

        </div>

      `;

    }



    let fechaHTML = "";


    if (fecha) {

      fechaHTML = `

        <div class="dato">

          <span class="dato-etiqueta">
            Fecha de registro
          </span>

          <span class="dato-valor">
            ${formatearFecha(fecha)}
          </span>

        </div>

      `;

    }



    /* =========================
       TELÉFONO
    ========================= */

    let telefonoHTML = "";


    if (telefono) {

      telefonoHTML = `

        <a
          class="boton telefono"
          href="tel:${telefono}"
        >

          📞
          <span>
            Llamar
          </span>

        </a>

      `;

    }



    /* =========================
       WHATSAPP
    ========================= */

    let whatsappHTML = "";


    if (whatsapp) {


      let numero =
        String(whatsapp)
        .replace(/\D/g, "");



      if (numero.startsWith("0")) {

        numero =
          "593" + numero.substring(1);

      }



      if (
        numero.length === 9 &&
        numero.startsWith("9")
      ) {

        numero =
          "593" + numero;

      }



      whatsappHTML = `

        <a
          class="boton whatsapp"
          href="https://wa.me/${numero}"
          target="_blank"
        >

          💬
          <span>
            WhatsApp
          </span>

        </a>

      `;

    }



    /* =========================
       AUDIO
    ========================= */

    let audioHTML = "";


    if (audio) {

      audioHTML = `

        <a
          class="boton audio"
          href="${audio}"
          target="_blank"
        >

          🔊
          <span>
            Escuchar audio
          </span>

        </a>

      `;

    }



    /* =========================
       MOSTRAR PERFIL
    ========================= */

    contenido.innerHTML = `


      <div class="encabezado">

        <div class="huella">
          🐾
        </div>

        <h1 class="titulo">
          Perfil de mascota
        </h1>

        <p class="subtitulo">
          Información de identificación
        </p>

      </div>



      <section class="tarjeta">


        ${fotoHTML}



        <div class="nombre-mascota">

          <h2>
            ${nombre}
          </h2>

          ${especieHTML}

        </div>



        ${estadoHTML}



        <div class="datos">

          ${colorHTML}

          ${responsableHTML}

          ${fechaHTML}

        </div>



        <div class="botones">

          ${audioHTML}

          ${telefonoHTML}

          ${whatsappHTML}

        </div>



        <div class="codigo">

          Código de identificación:
          <strong>${idBuscado}</strong>

        </div>


      </section>

    `;

  }


  catch (error) {


    console.error(
      "Error HUELLITAS QR:",
      error
    );


    contenido.innerHTML = `

      <div class="error">

        No se pudo conectar
        con la base de datos.

        <br><br>

        El código ${idBuscado}
        sí existe, pero la página
        no pudo leer PasteSheet.

      </div>

    `;

  }

}



/* =========================
   INICIAR
========================= */

cargarMascota();

</script>


</body>
</html>
