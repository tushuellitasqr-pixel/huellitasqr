<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HuellaQR</title>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f7f8;
  color: #333;
}

.contenedor {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  margin: 0 0 8px;
  font-size: 28px;
}

.estado {
  text-align: center;
  color: #198754;
  font-weight: bold;
  margin-bottom: 20px;
}

.foto {
  display: block;
  width: 100%;
  max-height: 400px;
  object-fit: cover;
  border-radius: 15px;
  margin-bottom: 20px;
}

.dato {
  background: #f7f7f7;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  line-height: 1.5;
}

.dato strong {
  margin-right: 5px;
}

.boton {
  display: block;
  text-align: center;
  text-decoration: none;
  color: white;
  padding: 13px;
  margin-top: 12px;
  border-radius: 10px;
  font-weight: bold;
}

.telefono {
  background: #0d6efd;
}

.whatsapp {
  background: #25D366;
}

.audio {
  margin-top: 20px;
  padding: 15px;
  background: #f7f7f7;
  border-radius: 10px;
  text-align: center;
}

.audio audio {
  width: 100%;
  margin-top: 12px;
}

.audio a {
  display: inline-block;
  margin-top: 12px;
  text-decoration: none;
  color: #0d6efd;
  font-weight: bold;
}

.error {
  text-align: center;
  color: #c62828;
  font-weight: bold;
}

</style>
</head>

<body>

<div class="contenedor">

  <div id="contenido">
    Cargando información...
  </div>

</div>


<script>

const API_MASCOTAS =
"https://pastesheet.com/api/rbgtavcc/REGISTROS";


/* =========================================================
   ESCAPAR TEXTO
   ========================================================= */

function escapar(texto) {

  if (texto === null || texto === undefined) {
    return "";
  }

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   CONVERTIR ENLACE DE GOOGLE DRIVE
   ========================================================= */

function obtenerIdDrive(url) {

  if (!url) return "";

  const texto = String(url);

  let encontrado =
    texto.match(/[?&]id=([a-zA-Z0-9_-]+)/);

  if (encontrado) {
    return encontrado[1];
  }

  encontrado =
    texto.match(/\/d\/([a-zA-Z0-9_-]+)/);

  if (encontrado) {
    return encontrado[1];
  }

  return "";
}


/* =========================================================
   IMAGEN DE GOOGLE DRIVE
   ========================================================= */

function imagenDrive(url) {

  if (!url) return "";

  const id =
    obtenerIdDrive(url);

  if (id) {

    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(id) +
      "&sz=w1000"
    );
  }

  return url;
}


/* =========================================================
   AUDIO DE GOOGLE DRIVE
   ========================================================= */

function audioDrive(url) {

  if (!url) return "";

  const id =
    obtenerIdDrive(url);

  if (id) {

    return (
      "https://drive.google.com/uc?export=download&id=" +
      encodeURIComponent(id)
    );
  }

  return url;
}


/* =========================================================
   FECHA DE GOOGLE SHEETS
   ========================================================= */

function fechaGoogleSheets(valor) {

  if (!valor) return "";

  const numero =
    Number(valor);

  if (!isNaN(numero) && numero > 30000) {

    const fecha =
      new Date(
        Date.UTC(1899, 11, 30) +
        numero * 86400000
      );

    const dia =
      String(
        fecha.getUTCDate()
      ).padStart(2, "0");

    const mes =
      String(
        fecha.getUTCMonth() + 1
      ).padStart(2, "0");

    const año =
      fecha.getUTCFullYear();

    return `${dia}/${mes}/${año}`;
  }

  return valor;
}


/* =========================================================
   WHATSAPP
   ========================================================= */

function whatsappLink(numero) {

  if (!numero) return "";

  let n =
    String(numero).replace(/\D/g, "");

  if (n.startsWith("0")) {

    n =
      "593" +
      n.substring(1);

  } else if (n.length === 9) {

    n =
      "593" +
      n;
  }

  return "https://wa.me/" + n;
}


/* =========================================================
   CARGAR MASCOTA
   ========================================================= */

async function cargarMascota() {

  const contenido =
    document.getElementById("contenido");


  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const id =
    parametros.get("id");


  if (!id) {

    contenido.innerHTML = `
      <p class="error">
        No se indicó el código de la mascota.
      </p>
    `;

    return;
  }


  try {

    const respuesta =
      await fetch(API_MASCOTAS);


    if (!respuesta.ok) {

      throw new Error(
        "No se pudo conectar con PasteSheet"
      );
    }


    const datos =
      await respuesta.json();


    const mascotas =
      datos.datos ||
      datos.data ||
      datos;


    if (!Array.isArray(mascotas)) {

      throw new Error(
        "Los datos recibidos no tienen el formato esperado."
      );
    }


    /* =====================================================
       BUSCAR MASCOTA POR ID
       ===================================================== */

    const animal =
      mascotas.find(
        m =>
          String(m["ID"]).trim() ===
          String(id).trim()
      );


    if (!animal) {

      contenido.innerHTML = `
        <p class="error">
          No se encontró una mascota con el código:
          <br><br>
          <strong>${escapar(id)}</strong>
        </p>
      `;

      return;
    }


    /* =====================================================
       CAMPOS EXACTOS DE PASTESHEET
       ===================================================== */

    const nombre =
      animal["Nombre de la mascota"] || "";

    const especie =
      animal["Especie"] || "";

    const sexo =
      animal["Sexo"] || "";

    const caracteristicas =
      animal["Color y características"] || "";

    const foto =
      animal["Foto de la mascota"] || "";

    const audio =
      animal["Audio"] || "";

    const telefono =
      animal["Teléfono de contacto"] || "";

    const whatsapp =
      animal["WhatsApp"] || "";

    const responsable =
      animal["Nombre del responsable"] || "";

    const fecha =
      animal["Fecha de registro"] || "";

    const estado =
      animal["Estado"] || "ACTIVO";


    /* =====================================================
       CONSTRUIR PERFIL
       ===================================================== */

    let html = "";


    /* NOMBRE */

    html += `
      <h1>🐾 ${escapar(nombre)}</h1>

      <div class="estado">
        ${escapar(estado)}
      </div>
    `;


    /* FOTO */

    if (foto) {

      html += `
        <img
          class="foto"
          src="${escapar(imagenDrive(foto))}"
          alt="Foto de ${escapar(nombre)}"
          onerror="this.style.display='none';"
        >
      `;
    }


    /* ESPECIE */

    if (especie) {

      html += `
        <div class="dato">
          <strong>Especie:</strong>
          ${escapar(especie)}
        </div>
      `;
    }


    /* SEXO */

    if (sexo) {

      html += `
        <div class="dato">
          <strong>Sexo:</strong>
          ${escapar(sexo)}
        </div>
      `;
    }


    /* CARACTERÍSTICAS */

    if (caracteristicas) {

      html += `
        <div class="dato">
          <strong>Características:</strong>
          ${escapar(caracteristicas)}
        </div>
      `;
    }


    /* RESPONSABLE */

    if (responsable) {

      html += `
        <div class="dato">
          <strong>Responsable:</strong>
          ${escapar(responsable)}
        </div>
      `;
    }


    /* FECHA */

    if (fecha) {

      html += `
        <div class="dato">
          <strong>Fecha de registro:</strong>
          ${fechaGoogleSheets(fecha)}
        </div>
      `;
    }


    /* ID */

    html += `
      <div class="dato">
        <strong>ID:</strong>
        ${escapar(id)}
      </div>
    `;


    /* TELÉFONO */

    if (telefono) {

      html += `
        <a
          class="boton telefono"
          href="tel:${escapar(telefono)}"
        >
          📞 Llamar
        </a>
      `;
    }


    /* WHATSAPP */

    if (whatsapp) {

      html += `
        <a
          class="boton whatsapp"
          href="${whatsappLink(whatsapp)}"
          target="_blank"
          rel="noopener"
        >
          💬 WhatsApp
        </a>
      `;
    }


    /* =====================================================
       AUDIO
       ===================================================== */

    if (audio) {

      const enlaceAudio =
        audioDrive(audio);

      html += `
        <div class="audio">

          <strong>
            🔊 Sonido de ${escapar(nombre)}
          </strong>

          <audio
            controls
            preload="metadata"
          >
            <source
              src="${escapar(enlaceAudio)}"
            >
            Tu navegador no puede reproducir este audio.
          </audio>

          <a
            href="${escapar(audio)}"
            target="_blank"
            rel="noopener"
          >
            🔊 Abrir sonido
          </a>

        </div>
      `;
    }


    contenido.innerHTML =
      html;

  }

  catch (error) {

    console.error(error);

    contenido.innerHTML = `
      <p class="error">
        No se pudo cargar la información de la mascota.
      </p>
    `;
  }
}


/* =========================================================
   INICIAR
   ========================================================= */

cargarMascota();

</script>

</body>
</html>
