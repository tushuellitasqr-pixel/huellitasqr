<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HuellaQR - Perfil de mascota</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .tarjeta {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    #foto {
      width: 100%;
      max-width: 350px;
      max-height: 350px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .dato {
      margin: 8px 0;
      font-size: 18px;
    }

    .etiqueta {
      font-weight: bold;
    }

    .estado {
      display: inline-block;
      margin: 15px 0;
      padding: 8px 15px;
      border-radius: 20px;
      background: #d4edda;
      color: #155724;
      font-weight: bold;
    }

    .boton {
      display: block;
      margin: 12px auto;
      padding: 12px 18px;
      max-width: 250px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }

    .telefono {
      background: #007bff;
    }

    .whatsapp {
      background: #25D366;
    }

    .audio {
      background: #6f42c1;
    }

    .oculto {
      display: none;
    }

    #cargando {
      font-size: 18px;
      margin-top: 40px;
    }

    #error {
      color: #b00020;
      font-weight: bold;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="tarjeta">

    <div id="cargando">
      Cargando información...
    </div>

    <div id="contenido" class="oculto">

      <img id="foto" src="" alt="Foto de la mascota">

      <h1 id="nombre"></h1>

      <div class="dato">
        <span class="etiqueta">Especie:</span>
        <span id="especie"></span>
      </div>

      <!-- NUEVO: SEXO -->
      <div class="dato">
        <span class="etiqueta">Sexo:</span>
        <span id="sexo"></span>
      </div>

      <div class="dato">
        <span class="etiqueta">Color y características:</span>
        <span id="color"></span>
      </div>

      <!-- NUEVO: RESPONSABLE -->
      <div class="dato" id="bloqueResponsable">
        <span class="etiqueta">Responsable:</span>
        <span id="responsable"></span>
      </div>

      <!-- NUEVO: FECHA -->
      <div class="dato" id="bloqueFecha">
        <span class="etiqueta">Fecha de registro:</span>
        <span id="fecha"></span>
      </div>

      <div class="dato">
        <span class="etiqueta">Código:</span>
        <span id="idMascota"></span>
      </div>

      <div id="estado" class="estado">
        ACTIVO
      </div>

      <a id="audio"
         class="boton audio oculto"
         href=""
         target="_blank">
        🔊 Escuchar sonido
      </a>

      <a id="telefono"
         class="boton telefono oculto"
         href="">
        📞 Llamar al responsable
      </a>

      <a id="whatsapp"
         class="boton whatsapp oculto"
         href=""
         target="_blank">
        💬 WhatsApp
      </a>

    </div>

    <div id="error" class="oculto"></div>

  </div>


  <script>

    /* =====================================================
       CONEXIONES
       ===================================================== */

    const API_MASCOTAS =
      "https://pastesheet.com/api/rbgtavcc/REGISTROS";

    const API_CONTACTOS =
      "https://pastesheet.com/api/1prjci1r/CONTACTOS";


    /* =====================================================
       CONVERTIR FOTO DE GOOGLE DRIVE
       ===================================================== */

    function convertirGoogleDrive(enlace) {

      if (!enlace) {
        return "";
      }

      let coincidencia = enlace.match(/\/d\/([^/]+)/);

      if (!coincidencia) {
        coincidencia = enlace.match(/[?&]id=([^&]+)/);
      }

      if (coincidencia) {

        const archivoID = coincidencia[1];

        return "https://drive.google.com/thumbnail?id="
          + archivoID
          + "&sz=w1000";
      }

      return enlace;
    }


    /* =====================================================
       CONVERTIR FECHA DE GOOGLE SHEETS
       ===================================================== */

    function convertirFecha(valor) {

      if (!valor) {
        return "";
      }

      const numero = Number(valor);

      if (!isNaN(numero) && numero > 30000) {

        const fecha = new Date(
          Date.UTC(1899, 11, 30) +
          numero * 86400000
        );

        const dia = String(
          fecha.getUTCDate()
        ).padStart(2, "0");

        const mes = String(
          fecha.getUTCMonth() + 1
        ).padStart(2, "0");

        const año =
          fecha.getUTCFullYear();

        return dia + "/" + mes + "/" + año;
      }

      return valor;
    }


    /* =====================================================
       OBTENER ID DE LA MASCOTA
       ===================================================== */

    const parametros =
      new URLSearchParams(window.location.search);

    const id =
      parametros.get("id");


    /* =====================================================
       MOSTRAR ERROR
       ===================================================== */

    function mostrarError(mensaje) {

      document
        .getElementById("cargando")
        .classList.add("oculto");

      const error =
        document.getElementById("error");

      error.textContent = mensaje;

      error.classList.remove("oculto");
    }


    /* =====================================================
       CARGAR MASCOTA
       ===================================================== */

    async function cargarMascota() {

      try {

        if (!id) {

          mostrarError(
            "No se encontró el código de la mascota."
          );

          return;
        }


        /* ===============================================
           CONSULTAR LAS BASES DE DATOS
           =============================================== */

        const [respuestaMascotas, respuestaContactos] =
          await Promise.all([

            fetch(API_MASCOTAS),

            fetch(API_CONTACTOS)

          ]);


        if (!respuestaMascotas.ok) {

          throw new Error(
            "No se pudo consultar la base de mascotas."
          );

        }


        /* ===============================================
           CONVERTIR RESPUESTAS A JSON
           =============================================== */

        const datosMascotas =
          await respuestaMascotas.json();


        let datosContactos = {
          data: []
        };


        if (respuestaContactos.ok) {

          try {

            datosContactos =
              await respuestaContactos.json();

          } catch (error) {

            datosContactos = {
              data: []
            };

          }

        }


        /* ===============================================
           OBTENER LISTAS
           =============================================== */

        const mascotas =
          datosMascotas.data || [];

        const contactos =
          datosContactos.data || [];


        /* ===============================================
           BUSCAR ID
           =============================================== */

        const idBuscado =
          id.trim().toUpperCase();


        const mascota =
          mascotas.find(animal =>

            String(animal.ID)
              .trim()
              .toUpperCase() === idBuscado

          );


        /* ===============================================
           BUSCAR CONTACTO
           =============================================== */

        const contacto =
          contactos.find(item =>

            String(item.ID)
              .trim()
              .toUpperCase() === idBuscado

          ) || {};


        /* ===============================================
           SI NO EXISTE LA MASCOTA
           =============================================== */

        if (!mascota) {

          mostrarError(
            "No se encontró una mascota con el código: "
            + idBuscado
          );

          return;
        }


        /* ===============================================
           NOMBRE
           =============================================== */

        document
          .getElementById("nombre")
          .textContent =
            mascota["Nombre de la mascota"] || "";


        /* ===============================================
           ESPECIE
           =============================================== */

        document
          .getElementById("especie")
          .textContent =
            mascota["Especie"] || "";


        /* ===============================================
           SEXO
           =============================================== */

        document
          .getElementById("sexo")
          .textContent =
            mascota["Sexo"] || "";


        /* ===============================================
           COLOR Y CARACTERÍSTICAS
           =============================================== */

        document
          .getElementById("color")
          .textContent =
            mascota["Color y características"] || "";


        /* ===============================================
           RESPONSABLE
           =============================================== */

        const responsable =
          mascota["Nombre del responsable"] || "";


        if (responsable) {

          document
            .getElementById("responsable")
            .textContent =
              responsable;

        } else {

          document
            .getElementById("bloqueResponsable")
            .classList.add("oculto");

        }


        /* ===============================================
           FECHA DE REGISTRO
           =============================================== */

        const fecha =
          mascota["Fecha de registro"] || "";


        if (fecha) {

          document
            .getElementById("fecha")
            .textContent =
              convertirFecha(fecha);

        } else {

          document
            .getElementById("bloqueFecha")
            .classList.add("oculto");

        }


        /* ===============================================
           ID
           =============================================== */

        document
          .getElementById("idMascota")
          .textContent =
            mascota["ID"] || idBuscado;


        /* ===============================================
           FOTO
           =============================================== */

        if (mascota["Foto de la mascota"]) {

          const foto =
            convertirGoogleDrive(
              mascota["Foto de la mascota"]
            );

          document
            .getElementById("foto")
            .src = foto;

        }


        /* ===============================================
           TELÉFONO
           =============================================== */

        const telefono =
          mascota["Teléfono de contacto"] ||
          contacto["TELEFONO"] ||
          contacto["Phone"] ||
          contacto["PHONE"];


        if (telefono) {

          const botonTelefono =
            document.getElementById("telefono");

          botonTelefono.href =
            "tel:" + telefono;

          botonTelefono.classList.remove("oculto");

        }


        /* ===============================================
           WHATSAPP
           =============================================== */

        const whatsapp =
          mascota["WhatsApp"] ||
          contacto["WHATSAPP"] ||
          contacto["WhatsApp"] ||
          contacto["WHATSAPP_URL"];


        if (whatsapp) {

          const botonWhatsapp =
            document.getElementById("whatsapp");


          let enlaceWhatsApp =
            String(whatsapp).trim();


          if (
            !enlaceWhatsApp.startsWith("http://") &&
            !enlaceWhatsApp.startsWith("https://")
          ) {

            enlaceWhatsApp =
              "https://wa.me/"
              + enlaceWhatsApp.replace(/\D/g, "");

          }


          botonWhatsapp.href =
            enlaceWhatsApp;

          botonWhatsapp.classList.remove("oculto");

        }


        /* ===============================================
           AUDIO
           =============================================== */

        if (mascota["Audio"]) {

          const botonAudio =
            document.getElementById("audio");

          botonAudio.href =
            mascota["Audio"];

          botonAudio.classList.remove("oculto");

        }


        /* ===============================================
           ESTADO
           =============================================== */

        document
          .getElementById("estado")
          .textContent =
            mascota["Estado"] || "ACTIVO";


        /* ===============================================
           MOSTRAR PERFIL
           =============================================== */

        document
          .getElementById("cargando")
          .classList.add("oculto");

        document
          .getElementById("contenido")
          .classList.remove("oculto");


      } catch (error) {

        console.error(error);

        mostrarError(
          "No se pudo cargar la información de la mascota."
        );

      }

    }


    /* =====================================================
       INICIAR
       ===================================================== */

    cargarMascota();

  </script>

</body>
</html>
