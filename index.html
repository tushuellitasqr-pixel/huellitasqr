<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuellaQR - Perfil de mascota</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .estado {
      text-align: center;
      color: #198754;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .foto {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .dato {
      margin: 12px 0;
      padding: 10px;
      background: #f7f7f7;
      border-radius: 10px;
    }

    .dato strong {
      display: inline-block;
      min-width: 145px;
    }

    .boton {
      display: block;
      text-align: center;
      padding: 12px;
      margin-top: 15px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .telefono {
      background: #0d6efd;
      color: white;
    }

    .audio {
      margin-top: 20px;
      text-align: center;
    }

    .error {
      text-align: center;
      color: #c62828;
      font-weight: bold;
    }

    .cargando {
      text-align: center;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <div id="contenido" class="cargando">
    Cargando información de la mascota...
  </div>

</div>

<script>

const API_MASCOTAS =
  "https://pastesheet.com/api/rbgtavcc/REGISTROS";


function convertirImagen(url) {

  if (!url) return "";

  const match = url.match(/[-\w]{25,}/);

  if (match) {
    return "https://drive.google.com/thumbnail?id=" + match[0] + "&sz=w1000";
  }

  return url;
}


function obtenerID() {

  const parametros = new URLSearchParams(window.location.search);

  return parametros.get("id");
}


async function cargarMascota() {

  const id = obtenerID();

  const contenido = document.getElementById("contenido");

  if (!id) {

    contenido.innerHTML =
      '<p class="error">No se indicó el código de la mascota.</p>';

    return;
  }


  try {

    const respuesta = await fetch(API_MASCOTAS);

    if (!respuesta.ok) {
      throw new Error("No se pudo conectar con la base de datos.");
    }

    const datos = await respuesta.json();

    const mascotas = datos.datos || datos.data || datos;

    const animal = mascotas.find(
      mascota => String(mascota.ID).trim() === String(id).trim()
    );


    if (!animal) {

      contenido.innerHTML =
        '<p class="error">No se encontró una mascota con el código: ' +
        id +
        '</p>';

      return;
    }


    const nombre =
      animal.Nombre ||
      animal.nombre ||
      "Sin nombre";


    const especie =
      animal.Especie ||
      animal.especie ||
      "No registrada";


    const sexo =
      animal.Sexo ||
      animal.sexo ||
      "No registrado";


    const caracteristicas =
      animal.Características ||
      animal.Caracteristicas ||
      animal.caracteristica ||
      "No registradas";


    const foto =
      animal.Foto ||
      animal.foto ||
      "";


    const audio =
      animal.Audio ||
      animal.audio ||
      "";


    const telefono =
      animal.Teléfono ||
      animal.Telefono ||
      animal.telefono ||
      "";


    const whatsapp =
      animal.WhatsApp ||
      animal.whatsapp ||
      "";


    const responsable =
      animal.Responsable ||
      animal.responsable ||
      "";


    const fecha =
      animal["Fecha de registro"] ||
      animal.Fecha ||
      animal.fecha ||
      "";


    const estado =
      animal.Estado ||
      animal.estado ||
      "ACTIVO";


    let html = "";

    html += `
      <h1>🐾 ${nombre}</h1>

      <div class="estado">
        ${estado}
      </div>
    `;


    if (foto) {

      html += `
        <img
          class="foto"
          src="${convertirImagen(foto)}"
          alt="Foto de ${nombre}"
        >
      `;

    }


    html += `
      <div class="dato">
        <strong>Especie:</strong>
        ${especie}
      </div>

      <div class="dato">
        <strong>Sexo:</strong>
        ${sexo}
      </div>

      <div class="dato">
        <strong>Características:</strong>
        ${caracteristicas}
      </div>

      <div class="dato">
        <strong>ID:</strong>
        ${animal.ID}
      </div>
    `;


    if (responsable) {

      html += `
        <div class="dato">
          <strong>Responsable:</strong>
          ${responsable}
        </div>
      `;

    }


    if (fecha) {

      html += `
        <div class="dato">
          <strong>Fecha de registro:</strong>
          ${fecha}
        </div>
      `;

    }


    if (telefono) {

      html += `
        <a
          class="boton telefono"
          href="tel:${telefono}"
        >
          📞 Llamar
        </a>
      `;

    }


    if (whatsapp) {

      let enlaceWhatsApp = whatsapp;

      if (!whatsapp.startsWith("http")) {

        enlaceWhatsApp =
          "https://wa.me/" +
          whatsapp.replace(/\D/g, "");

      }

      html += `
        <a
          class="boton whatsapp"
          href="${enlaceWhatsApp}"
          target="_blank"
        >
          💬 WhatsApp
        </a>
      `;

    }


    if (audio) {

      html += `
        <div class="audio">

          <p><strong>🔊 Sonido de la mascota</strong></p>

          <audio controls style="width:100%;">
            <source src="${audio}">
            Tu navegador no puede reproducir este audio.
          </audio>

        </div>
      `;

    }


    contenido.innerHTML = html;

  } catch (error) {

    console.error(error);

    contenido.innerHTML = `
      <p class="error">
        No se pudo cargar la información de la mascota.
      </p>
    `;

  }

}


cargarMascota();

</script>

</body>
</html>
