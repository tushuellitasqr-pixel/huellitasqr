<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Huellitas QR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #333;
    }

    .contenedor {
      max-width: 520px;
      margin: 30px auto;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .titulo {
      text-align: center;
      margin-bottom: 20px;
    }

    .titulo h1 {
      margin: 0;
      color: #287a4d;
      font-size: 30px;
    }

    .titulo p {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    .foto {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 16px;
      display: block;
      margin: 0 auto 22px;
    }

    .nombre {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #287a4d;
      margin-bottom: 22px;
    }

    .dato {
      padding: 10px 0;
      border-bottom: 1px solid #eeeeee;
      font-size: 16px;
    }

    .dato strong {
      color: #444;
    }

    .estado {
      display: inline-block;
      margin: 18px 0;
      padding: 7px 15px;
      border-radius: 20px;
      background: #dff4e6;
      color: #287a4d;
      font-weight: bold;
      font-size: 14px;
    }

    .botones {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .boton {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
      color: white;
      font-size: 16px;
    }

    .audio {
      background: #6c5ce7;
    }

    .llamar {
      background: #2196f3;
    }

    .whatsapp {
      background: #25d366;
    }

    .oculto {
      display: none !important;
    }

    .error {
      text-align: center;
      color: #c0392b;
      padding: 30px 10px;
      font-size: 17px;
    }

    .cargando {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .pie {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="titulo">
      <h1>🐾 Huellitas QR</h1>
      <p>Perfil de identificación de mascota</p>
    </div>

    <div id="cargando" class="cargando">
      Cargando información...
    </div>

    <div id="perfil" class="oculto">

      <img id="foto" class="foto oculto" alt="Foto de la mascota">

      <div id="nombre" class="nombre"></div>

      <div class="dato">
        <strong>Especie:</strong>
        <span id="especie"></span>
      </div>

      <div class="dato">
        <strong>Color y características:</strong>
        <span id="caracteristicas"></span>
      </div>

      <div class="dato">
        <strong>Responsable:</strong>
        <span id="responsable"></span>
      </div>

      <div class="dato">
        <strong>Fecha de registro:</strong>
        <span id="fecha"></span>
      </div>

      <div class="dato">
        <strong>Código:</strong>
        <span id="codigo"></span>
      </div>

      <div>
        <span id="estado" class="estado"></span>
      </div>

      <div class="botones">

        <a
          id="audio"
          class="boton audio oculto"
          target="_blank"
          rel="noopener noreferrer">
          🔊 Escuchar sonido
        </a>

        <a
          id="llamar"
          class="boton llamar oculto">
          📞 Llamar al responsable
        </a>

        <a
          id="whatsapp"
          class="boton whatsapp oculto"
          target="_blank"
          rel="noopener noreferrer">
          💬 WhatsApp
        </a>

      </div>

      <div class="pie">
        Huellitas QR 🐾
      </div>

    </div>

    <div id="error" class="error oculto"></div>

  </div>

  <script>

    const API_MASCOTAS =
      "https://pastesheet.com/api/rbgtavcc/REGISTROS";


    // --------------------------------------------------
    // CONVERTIR ENLACES DE GOOGLE DRIVE PARA MOSTRAR FOTO
    // --------------------------------------------------

    function convertirGoogleDrive(enlace) {

      if (!enlace) {
        return "";
      }

      const texto = String(enlace);

      let id = "";

      const parametro = texto.match(/[?&]id=([^&]+)/);

      if (parametro) {
        id = parametro[1];
      }

      if (!id) {

        const archivo = texto.match(
          /\/file\/d\/([^/]+)/
        );

        if (archivo) {
          id = archivo[1];
        }

      }

      if (!id) {
        return texto;
      }

      return "https://drive.google.com/thumbnail?id=" +
        id +
        "&sz=w1000";
    }


    // --------------------------------------------------
    // FORMATEAR FECHA
    // --------------------------------------------------

    function formatearFecha(valor) {

      if (!valor) {
        return "";
      }

      // Fecha en formato DD/MM/YYYY
      if (
        typeof valor === "string" &&
        /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(valor)
      ) {
        return valor;
      }

      // Fecha ISO
      if (
        typeof valor === "string" &&
        valor.includes("-")
      ) {

        const fecha = new Date(valor);

        if (!isNaN(fecha.getTime())) {

          return fecha.toLocaleDateString(
            "es-EC",
            {
              day: "2-digit",
              month: "2-digit",
              year: "numeric"
            }
          );
        }
      }

      // Número serial de Google Sheets
      if (!isNaN(valor)) {

        const numero = Number(valor);

        if (numero > 30000) {

          const fecha =
            new Date(
              Date.UTC(1899, 11, 30) +
              numero * 86400000
            );

          return fecha.toLocaleDateString(
            "es-EC",
            {
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
              timeZone: "UTC"
            }
          );
        }
      }

      return valor;
    }


    // --------------------------------------------------
    // OBTENER ID DESDE LA URL
    // --------------------------------------------------

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    const idBuscado =
      parametros.get("id");


    // --------------------------------------------------
    // MOSTRAR ERROR
    // --------------------------------------------------

    function mostrarError(mensaje) {

      document
        .getElementById("cargando")
        .classList.add("oculto");

      document
        .getElementById("perfil")
        .classList.add("oculto");

      const error =
        document.getElementById("error");

      error.textContent = mensaje;

      error.classList.remove("oculto");
    }


    // --------------------------------------------------
    // CARGAR MASCOTA
    // --------------------------------------------------

    async function cargarMascota() {

      if (!idBuscado) {

        mostrarError(
          "No se encontró el código de la mascota."
        );

        return;
      }

      try {

        const respuesta =
          await fetch(API_MASCOTAS);

        if (!respuesta.ok) {
          throw new Error(
            "No se pudo conectar con la base de datos."
          );
        }

        const datosMascotas =
          await respuesta.json();

        const mascotas =
          datosMascotas.data || [];

        const mascota =
          mascotas.find(
            animal =>
              String(animal.ID).trim().toUpperCase() ===
              String(idBuscado).trim().toUpperCase()
          );


        if (!mascota) {

          mostrarError(
            "No se encontró una mascota con el código " +
            idBuscado
          );

          return;
        }


        // ------------------------------------------------
        // DATOS PRINCIPALES
        // ------------------------------------------------

        document.getElementById("nombre").textContent =
          mascota["Nombre de la mascota"] || "";

        document.getElementById("especie").textContent =
          mascota["Especie"] || "";

        document.getElementById("caracteristicas").textContent =
          mascota["Color y características"] || "";

        document.getElementById("responsable").textContent =
          mascota["Nombre del responsable"] || "";

        document.getElementById("fecha").textContent =
          formatearFecha(
            mascota["Fecha de registro"]
          );

        document.getElementById("codigo").textContent =
          mascota["ID"] || "";

        document.getElementById("estado").textContent =
          mascota["Estado"] || "";


        // ------------------------------------------------
        // FOTO
        // ------------------------------------------------

        if (mascota["Foto de la mascota"]) {

          const foto =
            document.getElementById("foto");

          foto.src =
            convertirGoogleDrive(
              mascota["Foto de la mascota"]
            );

          foto.classList.remove("oculto");

          foto.onerror = function() {
            this.classList.add("oculto");
          };
        }


        // ------------------------------------------------
        // AUDIO
        // ------------------------------------------------

        if (mascota["Audio"]) {

          const botonAudio =
            document.getElementById("audio");

          botonAudio.href =
            mascota["Audio"];

          botonAudio.classList.remove("oculto");
        }


        // ------------------------------------------------
        // TELÉFONO
        // ------------------------------------------------

        if (mascota["Teléfono de contacto"]) {

          const telefono =
            String(
              mascota["Teléfono de contacto"]
            ).replace(
              /\D/g,
              ""
            );

          if (telefono) {

            const botonLlamar =
              document.getElementById("llamar");

            botonLlamar.href =
              "tel:" + telefono;

            botonLlamar.classList.remove(
              "oculto"
            );
          }
        }


        // ------------------------------------------------
        // WHATSAPP
        // ------------------------------------------------

        if (mascota["WhatsApp"]) {

          const whatsapp =
            String(
              mascota["WhatsApp"]
            ).replace(
              /\D/g,
              ""
            );

          if (whatsapp) {

            const botonWhatsApp =
              document.getElementById("whatsapp");

            botonWhatsApp.href =
              "https://wa.me/" + whatsapp;

            botonWhatsApp.classList.remove(
              "oculto"
            );
          }
        }


        // ------------------------------------------------
        // MOSTRAR PERFIL
        // ------------------------------------------------

        document
          .getElementById("cargando")
          .classList.add("oculto");

        document
          .getElementById("perfil")
          .classList.remove("oculto");


      } catch (error) {

        console.error(error);

        mostrarError(
          "No se pudo cargar la información de la mascota."
        );
      }
    }


    // --------------------------------------------------
    // INICIAR
    // --------------------------------------------------

    cargarMascota();

  </script>

</body>
</html>
