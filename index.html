<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HuellaQR</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    #foto {
      width: 100%;
      max-width: 320px;
      max-height: 320px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 10px 0;
      font-size: 30px;
    }

    .dato {
      font-size: 18px;
      margin: 8px 0;
    }

    .etiqueta {
      font-weight: bold;
    }

    .boton {
      display: block;
      width: 90%;
      margin: 12px auto;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      color: white;
      box-sizing: border-box;
    }

    .telefono {
      background: #1976d2;
    }

    .whatsapp {
      background: #25d366;
    }

    .audio {
      background: #7b1fa2;
    }

    .oculto {
      display: none;
    }

    .estado {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 16px;
      border-radius: 20px;
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: bold;
    }

    .error {
      color: #b71c1c;
      font-size: 20px;
      font-weight: bold;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div id="mensajeCargando">
      Cargando información...
    </div>

    <div id="perfil" class="oculto">

      <img id="foto" alt="Foto de la mascota">

      <h1 id="nombre"></h1>

      <div class="dato">
        <span class="etiqueta">Especie:</span>
        <span id="especie"></span>
      </div>

      <div class="dato">
        <span class="etiqueta">Color:</span>
        <span id="color"></span>
      </div>

      <div class="dato">
        <span class="etiqueta">ID:</span>
        <span id="idMascota"></span>
      </div>

      <div id="estado" class="estado"></div>

      <a id="audio"
         class="boton audio oculto"
         target="_blank">
        🔊 Escuchar sonido
      </a>

      <a id="telefono"
         class="boton telefono oculto">
        📞 Llamar
      </a>

      <a id="whatsapp"
         class="boton whatsapp oculto"
         target="_blank">
        💬 WhatsApp
      </a>

    </div>

    <div id="error" class="error oculto">
      No se encontró el código de la mascota.
    </div>

  </div>


<script>

  // ==========================================
  // CONEXIÓN CON PASTESHEET
  // ==========================================

  const API_MASCOTAS =
    "https://pastesheet.com/api/w4ajnkyn";

  const API_CONTACTOS =
    "https://pastesheet.com/api/1prjci1r/CONTACTOS";


  // ==========================================
  // OBTENER ID DESDE LA URL
  // ==========================================

  const parametros =
    new URLSearchParams(window.location.search);

  const id =
    parametros.get("id");


  // ==========================================
  // CONVERTIR ENLACES DE GOOGLE DRIVE
  // ==========================================

  function convertirGoogleDrive(enlace) {

    if (!enlace) {
      return "";
    }

    let coincidencia =
      enlace.match(/\/d\/([^/]+)/);

    if (!coincidencia) {
      coincidencia =
        enlace.match(/[?&]id=([^&]+)/);
    }

    if (coincidencia) {

      const archivoID =
        coincidencia[1];

      return "https://drive.google.com/thumbnail?id="
        + archivoID
        + "&sz=w1000";
    }

    return enlace;
  }


  // ==========================================
  // CARGAR INFORMACIÓN
  // ==========================================

  async function cargarMascota() {

    try {

      if (!id) {

        document
          .getElementById("mensajeCargando")
          .classList.add("oculto");

        document
          .getElementById("error")
          .classList.remove("oculto");

        return;
      }


      // --------------------------------------
      // CONSULTAR LAS DOS FUENTES
      // --------------------------------------

      const [respuestaMascotas, respuestaContactos] =
        await Promise.all([

          fetch(API_MASCOTAS),

          fetch(API_CONTACTOS)

        ]);


      if (!respuestaMascotas.ok ||
          !respuestaContactos.ok) {

        throw new Error(
          "No se pudieron consultar los datos."
        );
      }


      const datosMascotas =
        await respuestaMascotas.json();

      const datosContactos =
        await respuestaContactos.json();


      // --------------------------------------
      // BUSCAR LA MASCOTA POR ID
      // --------------------------------------

      const mascotas =
        datosMascotas.data || [];

      const contactos =
        datosContactos.data || [];


      const idBuscado =
        id.trim().toUpperCase();


      const mascota =
        mascotas.find(animal =>

          String(animal.ID)
            .trim()
            .toUpperCase()
          ===
          idBuscado

        );


      if (!mascota) {

        throw new Error(
          "Mascota no encontrada."
        );
      }


      // --------------------------------------
      // BUSCAR CONTACTO POR EL MISMO ID
      // --------------------------------------

      const contacto =
        contactos.find(item =>

          String(item.ID)
            .trim()
            .toUpperCase()
          ===
          idBuscado

        ) || {};


      // ======================================
      // MOSTRAR DATOS DE LA MASCOTA
      // ======================================

      document
        .getElementById("nombre")
        .textContent =
          mascota.Name || mascota.NOMBRE || "";


      document
        .getElementById("especie")
        .textContent =
          mascota.Species || mascota.ESPECIE || "";


      document
        .getElementById("color")
        .textContent =
          mascota.Color || mascota.COLOR || "";


      document
        .getElementById("idMascota")
        .textContent =
          mascota.ID || id;


      // ======================================
      // FOTO
      // ======================================

      if (mascota.Photo || mascota.FOTO) {

        const foto =
          mascota.Photo || mascota.FOTO;

        document
          .getElementById("foto")
          .src =
            convertirGoogleDrive(foto);

      } else {

        document
          .getElementById("foto")
          .classList.add("oculto");

      }


      // ======================================
      // AUDIO
      // ======================================

      if (mascota.Audio || mascota.AUDIO) {

        const audio =
          document.getElementById("audio");

        audio.href =
          mascota.Audio || mascota.AUDIO;

        audio.classList.remove("oculto");
      }


      // ======================================
      // ESTADO
      // ======================================

      document
        .getElementById("estado")
        .textContent =
          mascota.Status ||
          mascota.ESTADO ||
          "ACTIVO";


      // ======================================
      // TELÉFONO
      // AHORA VIENE DE CONTACTOS
      // ======================================

      if (contacto.TELEFONO ||
          contacto.Phone ||
          contacto.PHONE) {

        const telefono =
          contacto.TELEFONO ||
          contacto.Phone ||
          contacto.PHONE;

        const botonTelefono =
          document.getElementById("telefono");

        botonTelefono.href =
          "tel:" + telefono;

        botonTelefono.classList.remove("oculto");
      }


      // ======================================
      // WHATSAPP
      // AHORA VIENE DE CONTACTOS
      // ======================================

      if (contacto.WHATSAPP ||
          contacto.WhatsApp ||
          contacto.WHATSAPP_URL) {

        const whatsapp =
          contacto.WHATSAPP ||
          contacto.WhatsApp ||
          contacto.WHATSAPP_URL;

        const botonWhatsapp =
          document.getElementById("whatsapp");

        botonWhatsapp.href =
          whatsapp;

        botonWhatsapp.classList.remove("oculto");
      }


      // ======================================
      // MOSTRAR PERFIL
      // ======================================

      document
        .getElementById("mensajeCargando")
        .classList.add("oculto");

      document
        .getElementById("perfil")
        .classList.remove("oculto");


    } catch (error) {

      console.error(error);

      document
        .getElementById("mensajeCargando")
        .classList.add("oculto");

      document
        .getElementById("perfil")
        .classList.add("oculto");

      document
        .getElementById("error")
        .classList.remove("oculto");
    }

  }


  // ==========================================
  // INICIAR
  // ==========================================

  cargarMascota();

</script>

</body>
</html>
