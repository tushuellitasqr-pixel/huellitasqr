<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Huellitas QR</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #333;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    h1 {
      margin-top: 0;
      color: #222;
    }

    .foto {
      width: 100%;
      max-width: 350px;
      max-height: 350px;
      object-fit: cover;
      border-radius: 15px;
      margin: 15px auto;
      display: block;
    }

    .dato {
      margin: 10px 0;
      font-size: 17px;
      text-align: left;
    }

    .dato strong {
      color: #222;
    }

    .estado {
      display: inline-block;
      margin: 15px 0;
      padding: 8px 18px;
      border-radius: 20px;
      background: #dff5df;
      color: #217a21;
      font-weight: bold;
    }

    .codigo {
      font-size: 14px;
      color: #777;
      margin-top: 15px;
    }

    .boton {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 10px 0;
      padding: 13px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      cursor: pointer;
    }

    .audio {
      background: #333;
    }

    .llamar {
      background: #198754;
    }

    .whatsapp {
      background: #25d366;
    }

    .oculto {
      display: none !important;
    }

    .cargando {
      font-size: 18px;
      margin: 40px 0;
    }

    .error {
      color: #b00020;
      font-weight: bold;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>🐾 HUELLITAS QR</h1>

    <div id="cargando" class="cargando">
      Buscando información de la mascota...
    </div>

    <div id="perfil" class="oculto">

      <img
        id="foto"
        class="foto"
        alt="Foto de la mascota"
      >

      <h2 id="nombre"></h2>

      <div class="dato">
        <strong>Especie:</strong>
        <span id="especie"></span>
      </div>

      <div class="dato">
        <strong>Color y características:</strong>
        <span id="color"></span>
      </div>

      <div class="dato">
        <strong>Responsable:</strong>
        <span id="responsable"></span>
      </div>

      <div class="dato">
        <strong>Fecha de registro:</strong>
        <span id="fecha"></span>
      </div>

      <div id="estado" class="estado"></div>

      <div class="codigo">
        Código de identificación:
        <strong id="codigo"></strong>
      </div>

      <a
        id="audio"
        class="boton audio oculto"
        target="_blank"
        rel="noopener noreferrer"
      >
        🔊 Escuchar sonido
      </a>

      <a
        id="telefono"
        class="boton llamar oculto"
      >
        📞 Llamar
      </a>

      <a
        id="whatsapp"
        class="boton whatsapp oculto"
        target="_blank"
        rel="noopener noreferrer"
      >
        💬 WhatsApp
      </a>

    </div>

    <div id="error" class="error oculto"></div>

  </div>


  <script>

    const API_MASCOTAS =
      "https://pastesheet.com/api/rbgtavcc/REGISTROS";


    function convertirGoogleDrive(url) {

      if (!url) {
        return "";
      }

      if (url.includes("drive.google.com")) {

        let id = "";

        const matchOpen =
          url.match(/[?&]id=([^&]+)/);

        if (matchOpen) {
          id = matchOpen[1];
        }

        if (!id) {

          const matchFile =
            url.match(/\/file\/d\/([^/]+)/);

          if (matchFile) {
            id = matchFile[1];
          }
        }

        if (id) {

          return "https://drive.google.com/thumbnail?id="
            + id
            + "&sz=w1000";
        }
      }

      return url;
    }


    function formatearFecha(fecha) {

      if (!fecha) {
        return "";
      }

      /*
        Fecha DD/MM/YYYY
      */

      if (
        typeof fecha === "string" &&
        /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(fecha)
      ) {

        return fecha;
      }


      /*
        Fecha ISO
      */

      if (
        typeof fecha === "string" &&
        fecha.includes("-")
      ) {

        const fechaISO =
          new Date(fecha);

        if (!isNaN(fechaISO.getTime())) {

          return fechaISO.toLocaleDateString("es-EC");
        }
      }


      /*
        Fecha serial de Google Sheets
      */

      const numero =
        Number(fecha);

      if (!isNaN(numero) && numero > 30000) {

        const fechaSheets =
          new Date(
            Date.UTC(1899, 11, 30)
            + numero * 86400000
          );

        return fechaSheets.toLocaleDateString("es-EC");
      }


      return fecha;
    }


    async function cargarMascota() {

      const parametros =
        new URLSearchParams(
          window.location.search
        );

      const idBuscado =
        parametros
        .get("id")
        ?.trim()
        .toUpperCase();


      if (!idBuscado) {

        document.getElementById("cargando")
          .classList.add("oculto");

        document.getElementById("error")
          .textContent =
          "No se indicó el código de la mascota.";

        document.getElementById("error")
          .classList.remove("oculto");

        return;
      }


      try {

        /*
          Se agrega una marca de tiempo
          para evitar utilizar una respuesta
          anterior almacenada en caché.
        */

        const urlAPI =
          API_MASCOTAS
          + "?_="
          + Date.now();


        const respuesta =
          await fetch(
            urlAPI,
            {
              cache: "no-store"
            }
          );


        if (!respuesta.ok) {
          throw new Error(
            "No se pudo consultar la base de datos."
          );
        }


        const datosMascotas =
          await respuesta.json();


        const lista =
          datosMascotas.data || [];


        const mascota =
          lista.find(
            animal =>
              String(animal.ID || "")
              .trim()
              .toUpperCase()
              === idBuscado
          );


        document.getElementById("cargando")
          .classList.add("oculto");


        if (!mascota) {

          document.getElementById("error")
            .textContent =
            "No se encontró una mascota con el código "
            + idBuscado;

          document.getElementById("error")
            .classList.remove("oculto");

          return;
        }


        /*
          FOTO
        */

        const foto =
          convertirGoogleDrive(
            mascota["Foto de la mascota"]
          );


        if (foto) {

          const imagen =
            document.getElementById("foto");

          imagen.src = foto;

          imagen.classList.remove("oculto");

        } else {

          document.getElementById("foto")
            .classList.add("oculto");
        }


        /*
          DATOS
        */

        document.getElementById("nombre")
          .textContent =
          mascota["Nombre de la mascota"] || "";


        document.getElementById("especie")
          .textContent =
          mascota["Especie"] || "";


        document.getElementById("color")
          .textContent =
          mascota["Color y características"] || "";


        document.getElementById("responsable")
          .textContent =
          mascota["Nombre del responsable"] || "";


        document.getElementById("fecha")
          .textContent =
          formatearFecha(
            mascota["Fecha de registro"]
          );


        document.getElementById("codigo")
          .textContent =
          mascota["ID"] || idBuscado;


        /*
          ESTADO
        */

        document.getElementById("estado")
          .textContent =
          mascota["Estado"] || "ACTIVO";


        /*
          AUDIO
        */

        if (mascota["Audio"]) {

          const botonAudio =
            document.getElementById("audio");

          botonAudio.href =
            mascota["Audio"];

          botonAudio.classList.remove("oculto");

        }


        /*
          TELÉFONO
        */

        if (mascota["Teléfono de contacto"]) {

          const telefono =
            String(
              mascota["Teléfono de contacto"]
            )
            .replace(/\D/g, "");


          if (telefono) {

            const botonTelefono =
              document.getElementById("telefono");

            botonTelefono.href =
              "tel:" + telefono;

            botonTelefono.classList.remove("oculto");
          }
        }


        /*
          WHATSAPP
        */

        if (mascota["WhatsApp"]) {

          const whatsapp =
            String(
              mascota["WhatsApp"]
            )
            .replace(/\D/g, "");


          if (whatsapp) {

            const botonWhatsapp =
              document.getElementById("whatsapp");


            /*
              Si el número ecuatoriano
              comienza con 0, se cambia
              al código internacional 593.
            */

            let numeroWhatsApp =
              whatsapp;


            if (
              numeroWhatsApp.startsWith("0")
            ) {

              numeroWhatsApp =
                "593"
                + numeroWhatsApp.substring(1);
            }


            botonWhatsapp.href =
              "https://wa.me/"
              + numeroWhatsApp;


            botonWhatsapp.classList.remove("oculto");
          }
        }


        /*
          MOSTRAR PERFIL
        */

        document.getElementById("perfil")
          .classList.remove("oculto");


      } catch (error) {

        console.error(error);


        document.getElementById("cargando")
          .classList.add("oculto");


        document.getElementById("error")
          .textContent =
          "No fue posible cargar la información de la mascota. Intenta nuevamente.";

        document.getElementById("error")
          .classList.remove("oculto");
      }

    }


    cargarMascota();

  </script>

</body>

</html>
