<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HUELLITAS QR</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #333;
    }

    /* =========================
       BANNER
    ========================= */

    .banner {
      width: 100%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      line-height: 0;
    }

    .banner img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* =========================
       CONTENIDO
    ========================= */

    .pagina {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 18px 18px 40px;
    }

    .encabezado {
      text-align: center;
      margin-bottom: 16px;
    }

    .huella {
      font-size: 25px;
      margin-bottom: 4px;
    }

    .titulo {
      font-size: 25px;
      font-weight: 700;
      margin: 0;
      color: #333;
    }

    .subtitulo {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    /* =========================
       TARJETA PRINCIPAL
    ========================= */

    .tarjeta {
      background: white;
      border-radius: 22px;
      padding: 19px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    /* =========================
       FOTO
    ========================= */

    #foto {
      width: 100%;
      height: 310px;
      object-fit: cover;
      border-radius: 17px;
      display: block;
      background: #eeeeee;
    }

    /* =========================
       NOMBRE
    ========================= */

    .nombre-mascota {
      text-align: center;
      margin-top: 18px;
    }

    .nombre-mascota h2 {
      margin: 0;
      font-size: 30px;
      color: #333;
    }

    .especie {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 13px;
      border-radius: 20px;
      background: #f0f0f0;
      color: #555;
      font-size: 14px;
    }

    /* =========================
       ESTADO
    ========================= */

    .estado {
      text-align: center;
      margin: 15px 0;
    }

    .estado span {
      display: inline-block;
      background: #e7f7ed;
      color: #228447;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    /* =========================
       DATOS
    ========================= */

    .datos {
      margin-top: 18px;
    }

    .dato {
      background: #f7f8f9;
      border-radius: 13px;
      padding: 13px 15px;
      margin-bottom: 10px;
    }

    .dato-titulo {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }

    .dato-contenido {
      font-size: 16px;
      color: #333;
      word-break: break-word;
    }

    /* =========================
       BOTONES
    ========================= */

    .botones {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 18px;
    }

    .boton {
      flex: 1;
      min-width: 130px;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      text-decoration: none;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #333;
      color: white;
    }

    .boton-audio {
      background: #555;
    }

    .boton-telefono {
      background: #444;
    }

    .boton-whatsapp {
      background: #333;
    }

    /* =========================
       CÓDIGO
    ========================= */

    .codigo {
      text-align: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #eeeeee;
      font-size: 13px;
      color: #777;
    }

    .codigo strong {
      color: #333;
    }

    /* =========================
       PIE
    ========================= */

    .pie {
      text-align: center;
      margin-top: 20px;
      color: #999;
      font-size: 12px;
    }

    /* =========================
       MENSAJES
    ========================= */

    .mensaje {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .mensaje h2 {
      color: #333;
    }

    /* =========================
       MÓVIL
    ========================= */

    @media (max-width: 480px) {

      .banner img {
        width: 100%;
        height: auto;
      }

      .pagina {
        padding: 18px 14px 35px;
      }

      .titulo {
        font-size: 23px;
      }

      #foto {
        height: 270px;
      }

      .nombre-mascota h2 {
        font-size: 27px;
      }

      .boton {
        min-width: 100%;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       BANNER
  ========================= -->

  <div class="banner">

    <img
      src="https://tushuellitasqr-pixel.github.io/huellitasqr/banner.jpg"
      alt="Huellitas QR"
    >

  </div>


  <!-- =========================
       CONTENIDO
  ========================= -->

  <main class="pagina">

    <div class="encabezado">

      <div class="huella">🐾</div>

      <h1 class="titulo">
        Perfil de mascota
      </h1>

      <div class="subtitulo">
        Información de identificación
      </div>

    </div>


    <section class="tarjeta">

      <img
        id="foto"
        src=""
        alt="Foto de la mascota"
      >


      <div class="nombre-mascota">

        <h2 id="nombre">
          Cargando...
        </h2>

        <div
          id="especie"
          class="especie"
        ></div>

      </div>


      <div class="estado">

        <span id="estado">
          ACTIVO
        </span>

      </div>


      <div class="datos">

        <div class="dato">

          <div class="dato-titulo">
            Color y características
          </div>

          <div
            id="color"
            class="dato-contenido"
          ></div>

        </div>


        <div
          class="dato"
          id="bloqueResponsable"
          style="display:none;"
        >

          <div class="dato-titulo">
            Responsable
          </div>

          <div
            id="responsable"
            class="dato-contenido"
          ></div>

        </div>


        <div
          class="dato"
          id="bloqueFecha"
          style="display:none;"
        >

          <div class="dato-titulo">
            Fecha de registro
          </div>

          <div
            id="fecha"
            class="dato-contenido"
          ></div>

        </div>

      </div>


      <div
        class="botones"
        id="botones"
      >

        <button
          id="botonAudio"
          class="boton boton-audio"
          style="display:none;"
          onclick="reproducirAudio()"
        >
          🔊 Escuchar
        </button>


        <a
          id="botonTelefono"
          class="boton boton-telefono"
          style="display:none;"
        >
          📞 Llamar
        </a>


        <a
          id="botonWhatsApp"
          class="boton boton-whatsapp"
          style="display:none;"
          target="_blank"
        >
          💬 WhatsApp
        </a>

      </div>


      <div class="codigo">

        ID de identificación:
        <strong id="codigo"></strong>

      </div>

    </section>


    <div class="pie">
      🐾 HUELLITAS QR
    </div>

  </main>


  <!-- =========================
       SCRIPT
  ========================= -->

  <script>

    const API_MASCOTAS =
      "https://pastesheet.com/api/rbgtavcc";


    function convertirGoogleDrive(url) {

      if (!url) {
        return "";
      }

      const coincidencia =
        url.match(/[?&]id=([^&]+)/);

      if (coincidencia) {

        return "https://drive.google.com/thumbnail?id="
          + coincidencia[1]
          + "&sz=w1200";

      }

      return url;
    }


    function formatearFecha(valor) {

      if (!valor) {
        return "";
      }

      const numero =
        parseFloat(valor);

      if (!isNaN(numero)) {

        const fecha =
          new Date(
            Date.UTC(1899, 11, 30)
          );

        fecha.setUTCDate(
          fecha.getUTCDate() + Math.floor(numero)
        );

        return fecha.toLocaleDateString(
          "es-EC",
          {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }
        );
      }

      return valor;
    }


    function obtenerID() {

      const parametros =
        new URLSearchParams(
          window.location.search
        );

      return (
        parametros.get("id") || ""
      )
      .trim()
      .toUpperCase();

    }


    async function cargarMascota() {

      const id =
        obtenerID();

      if (!id) {

        document.querySelector(".tarjeta").innerHTML =
          '<div class="mensaje">' +
          '<h2>Mascota no encontrada</h2>' +
          '<p>No se ha indicado un ID de mascota.</p>' +
          '</div>';

        return;
      }


      try {

        const respuesta =
          await fetch(API_MASCOTAS);


        if (!respuesta.ok) {

          throw new Error(
            "No se pudo consultar la base de datos."
          );

        }


        const datosMascotas =
          await respuesta.json();


        const animales =
          datosMascotas.data || [];


        const animal =
          animales.find(
            registro =>
              String(registro.ID)
                .trim()
                .toUpperCase() === id
          );


        if (!animal) {

          document.querySelector(".tarjeta").innerHTML =
            '<div class="mensaje">' +
            '<h2>Mascota no encontrada</h2>' +
            '<p>El código <strong>' +
            id +
            '</strong> no corresponde a una mascota registrada.</p>' +
            '</div>';

          return;
        }


        /* =========================
           DATOS PRINCIPALES
        ========================= */

        document.getElementById("nombre").textContent =
          animal["Nombre de la mascota"] || "Sin nombre";


        document.getElementById("especie").textContent =
          animal["Especie"] || "Sin especificar";


        document.getElementById("color").textContent =
          animal["Color y características"] ||
          "Sin información";


        document.getElementById("codigo").textContent =
          animal["ID"] || id;


        /* =========================
           FOTO
        ========================= */

        const foto =
          convertirGoogleDrive(
            animal["Foto de la mascota"]
          );


        if (foto) {

          document.getElementById("foto").src =
            foto;

        } else {

          document.getElementById("foto").style.display =
            "none";

        }


        /* =========================
           RESPONSABLE
        ========================= */

        const responsable =
          animal["Nombre del responsable"];


        if (responsable) {

          document.getElementById(
            "responsable"
          ).textContent =
            responsable;

          document.getElementById(
            "bloqueResponsable"
          ).style.display =
            "block";

        }


        /* =========================
           FECHA
        ========================= */

        const fecha =
          animal["Fecha de registro"];


        if (fecha) {

          document.getElementById(
            "fecha"
          ).textContent =
            formatearFecha(fecha);

          document.getElementById(
            "bloqueFecha"
          ).style.display =
            "block";

        }


        /* =========================
           ESTADO
        ========================= */

        const estado =
          animal["Estado"] || "ACTIVO";


        document.getElementById(
          "estado"
        ).textContent =
          estado;


        /* =========================
           AUDIO
        ========================= */

        const audio =
          animal["Audio"];


        if (audio) {

          document.getElementById(
            "botonAudio"
          ).style.display =
            "block";

          window.audioMascota =
            convertirGoogleDrive(audio);

        }


        /* =========================
           TELÉFONO
        ========================= */

        const telefono =
          animal["Teléfono de contacto"];


        if (telefono) {

          const botonTelefono =
            document.getElementById(
              "botonTelefono"
            );

          botonTelefono.href =
            "tel:" + telefono;

          botonTelefono.style.display =
            "block";

        }


        /* =========================
           WHATSAPP
        ========================= */

        const whatsapp =
          animal["WhatsApp"];


        if (whatsapp) {

          const botonWhatsApp =
            document.getElementById(
              "botonWhatsApp"
            );


          const numero =
            String(whatsapp)
              .replace(/\D/g, "");


          botonWhatsApp.href =
            "https://wa.me/" +
            numero;


          botonWhatsApp.style.display =
            "block";

        }

      } catch (error) {

        console.error(error);


        document.querySelector(".tarjeta").innerHTML =
          '<div class="mensaje">' +
          '<h2>No se pudo cargar el perfil</h2>' +
          '<p>Intenta nuevamente en unos momentos.</p>' +
          '</div>';

      }

    }


    function reproducirAudio() {

      const audio =
        window.audioMascota;


      if (!audio) {
        return;
      }


      const reproductor =
        new Audio(audio);


      reproductor.play()
        .catch(
          error => {
            console.error(error);
            window.open(audio, "_blank");
          }
        );

    }


    cargarMascota();

  </script>

</body>
</html>
