<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HuellaQR</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f7f8;
  color: #333;
}

.contenedor {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  margin: 0 0 8px;
}

.estado {
  text-align: center;
  color: #198754;
  font-weight: bold;
  margin-bottom: 20px;
}

.foto {
  display: block;
  width: 100%;
  max-height: 400px;
  object-fit: cover;
  border-radius: 15px;
  margin-bottom: 20px;
}

.dato {
  background: #f7f7f7;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
}

.dato strong {
  margin-right: 5px;
}

.boton {
  display: block;
  text-align: center;
  text-decoration: none;
  color: white;
  padding: 13px;
  margin-top: 12px;
  border-radius: 10px;
  font-weight: bold;
}

.telefono {
  background: #0d6efd;
}

.whatsapp {
  background: #25D366;
}

.audio {
  margin-top: 20px;
  padding: 15px;
  background: #f7f7f7;
  border-radius: 10px;
  text-align: center;
}

.audio audio {
  width: 100%;
}

.error {
  text-align: center;
  color: #c62828;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="contenedor">
  <div id="contenido">
    Cargando información...
  </div>
</div>

<script>

const API_MASCOTAS =
"https://pastesheet.com/api/rbgtavcc/REGISTROS";


function valor(obj, campo) {
  return obj[campo] ?? "";
}


function fechaGoogleSheets(valor) {

  if (!valor) return "";

  const numero = Number(valor);

  if (!isNaN(numero) && numero > 30000) {

    const fecha = new Date(
      Date.UTC(1899, 11, 30) +
      numero * 86400000
    );

    const dia = String(
      fecha.getUTCDate()
    ).padStart(2, "0");

    const mes = String(
      fecha.getUTCMonth() + 1
    ).padStart(2, "0");

    const año =
      fecha.getUTCFullYear();

    return `${dia}/${mes}/${año}`;
  }

  return valor;
}


function imagenDrive(url) {

  if (!url) return "";

  const encontrado =
    String(url).match(/[-\w]{25,}/);

  if (encontrado) {

    return "https://drive.google.com/thumbnail?id=" +
      encontrado[0] +
      "&sz=w1000";
  }

  return url;
}


function whatsappLink(numero) {

  if (!numero) return "";

  let n =
    String(numero).replace(/\D/g, "");

  if (n.startsWith("0")) {
    n = "593" + n.substring(1);
  }

  else if (n.length === 9) {
    n = "593" + n;
  }

  return "https://wa.me/" + n;
}


async function cargarMascota() {

  const contenido =
    document.getElementById("contenido");

  const parametros =
    new URLSearchParams(
      window.location.search
    );

  const id =
    parametros.get("id");


  if (!id) {

    contenido.innerHTML =
    `<p class="error">
      No se indicó el código de la mascota.
    </p>`;

    return;
  }


  try {

    const respuesta =
      await fetch(API_MASCOTAS);


    const datos =
      await respuesta.json();


    const mascotas =
      datos.datos || datos.data || datos;


    const animal =
      mascotas.find(
        m =>
        String(m.ID).trim() ===
        String(id).trim()
      );


    if (!animal) {

      contenido.innerHTML =
      `<p class="error">
        No se encontró una mascota con el código:
        ${id}
      </p>`;

      return;
    }


    /*
    CAMPOS EXACTOS DE REGISTROS

    A ID
    B Nombre
    C Especie
    D Sexo
    E Características
    F Foto
    G Audio
    H Teléfono
    I WhatsApp
    J Responsable
    K Fecha de registro
    L Estado
    */


    const nombre =
      valor(animal, "Nombre");

    const especie =
      valor(animal, "Especie");

    const sexo =
      valor(animal, "Sexo");

    const caracteristicas =
      valor(animal, "Características");

    const foto =
      valor(animal, "Foto");

    const audio =
      valor(animal, "Audio");

    const telefono =
      valor(animal, "Teléfono");

    const whatsapp =
      valor(animal, "WhatsApp");

    const responsable =
      valor(animal, "Responsable");

    const fecha =
      valor(animal, "Fecha de registro");

    const estado =
      valor(animal, "Estado") || "ACTIVO";


    let html = "";


    /* NOMBRE */

    html += `
      <h1>🐾 ${nombre}</h1>

      <div class="estado">
        ${estado}
      </div>
    `;


    /* FOTO */

    if (foto) {

      html += `
        <img
          class="foto"
          src="${imagenDrive(foto)}"
          alt="Foto de ${nombre}"
        >
      `;
    }


    /* ESPECIE */

    if (especie) {

      html += `
        <div class="dato">
          <strong>Especie:</strong>
          ${especie}
        </div>
      `;
    }


    /* SEXO */

    if (sexo) {

      html += `
        <div class="dato">
          <strong>Sexo:</strong>
          ${sexo}
        </div>
      `;
    }


    /* CARACTERÍSTICAS */

    if (caracteristicas) {

      html += `
        <div class="dato">
          <strong>Características:</strong>
          ${caracteristicas}
        </div>
      `;
    }


    /* RESPONSABLE */

    if (responsable) {

      html += `
        <div class="dato">
          <strong>Responsable:</strong>
          ${responsable}
        </div>
      `;
    }


    /* FECHA */

    if (fecha) {

      html += `
        <div class="dato">
          <strong>Fecha de registro:</strong>
          ${fechaGoogleSheets(fecha)}
        </div>
      `;
    }


    /* ID */

    html += `
      <div class="dato">
        <strong>ID:</strong>
        ${id}
      </div>
    `;


    /* TELÉFONO */

    if (telefono) {

      html += `
        <a
          class="boton telefono"
          href="tel:${telefono}"
        >
          📞 Llamar
        </a>
      `;
    }


    /* WHATSAPP */

    if (whatsapp) {

      html += `
        <a
          class="boton whatsapp"
          href="${whatsappLink(whatsapp)}"
          target="_blank"
        >
          💬 WhatsApp
        </a>
      `;
    }


    /* AUDIO */

    if (audio) {

      html += `
        <div class="audio">

          <strong>
            🔊 Escuchar sonido
          </strong>

          <br><br>

          <audio controls>
            <source src="${audio}">
            Tu navegador no puede reproducir este audio.
          </audio>

        </div>
      `;
    }


    contenido.innerHTML = html;


  } catch (error) {

    console.error(error);

    contenido.innerHTML =
    `<p class="error">
      No se pudo cargar la información de la mascota.
    </p>`;
  }
}


cargarMascota();

</script>

</body>
</html>
