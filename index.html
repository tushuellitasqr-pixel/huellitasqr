<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HuellaQR</title>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .estado {
      text-align: center;
      color: #198754;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .foto {
      display: block;
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .dato {
      background: #f7f7f7;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
    }

    .dato strong {
      display: inline-block;
      margin-right: 5px;
    }

    .boton {
      display: block;
      text-align: center;
      text-decoration: none;
      color: white;
      padding: 13px;
      margin-top: 12px;
      border-radius: 10px;
      font-weight: bold;
    }

    .telefono {
      background: #0d6efd;
    }

    .whatsapp {
      background: #25D366;
    }

    .audio {
      margin-top: 20px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 10px;
      text-align: center;
    }

    audio {
      width: 100%;
    }

    .mensaje {
      text-align: center;
      padding: 30px 10px;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

  </style>

</head>

<body>

<div class="contenedor">

  <div id="contenido" class="mensaje">
    Cargando información...
  </div>

</div>


<script>

const API_MASCOTAS =
  "https://pastesheet.com/api/rbgtavcc/REGISTROS";


function obtenerID() {

  const parametros =
    new URLSearchParams(window.location.search);

  return parametros.get("id");

}


function obtenerValor(objeto, nombres) {

  for (const nombre of nombres) {

    if (
      objeto[nombre] !== undefined &&
      objeto[nombre] !== null &&
      String(objeto[nombre]).trim() !== ""
    ) {

      return String(objeto[nombre]).trim();

    }

  }

  return "";

}


function convertirImagen(url) {

  if (!url) return "";

  url = String(url).trim();

  const coincidencia =
    url.match(/[-\w]{25,}/);

  if (coincidencia) {

    return "https://drive.google.com/thumbnail?id=" +
      coincidencia[0] +
      "&sz=w1000";

  }

  return url;

}


/* Convertir fecha de Google Sheets */

function convertirFecha(fecha) {

  if (!fecha) return "";

  const numero =
    Number(fecha);

  if (!isNaN(numero) && numero > 30000) {

    const fechaBase =
      new Date(1899, 11, 30);

    fechaBase.setDate(
      fechaBase.getDate() + Math.floor(numero)
    );

    const dia =
      String(fechaBase.getDate()).padStart(2, "0");

    const mes =
      String(fechaBase.getMonth() + 1).padStart(2, "0");

    const año =
      fechaBase.getFullYear();

    return `${dia}/${mes}/${año}`;

  }

  return fecha;

}


/* Convertir WhatsApp */

function convertirWhatsApp(numero) {

  if (!numero) return "";

  let limpio =
    String(numero).replace(/\D/g, "");

  /*
    Si el número tiene 9 dígitos,
    asumimos que es un número celular de Ecuador
    y agregamos 593.
  */

  if (limpio.length === 9) {

    limpio = "593" + limpio;

  }

  /*
    Si empieza con 0 y tiene 10 dígitos,
    quitamos el 0 y agregamos 593.
  */

  if (
    limpio.length === 10 &&
    limpio.startsWith("0")
  ) {

    limpio =
      "593" + limpio.substring(1);

  }

  return limpio;

}


async function cargarMascota() {

  const contenido =
    document.getElementById("contenido");

  const id =
    obtenerID();


  if (!id) {

    contenido.innerHTML = `

      <p class="error">
        No se indicó el código de la mascota.
      </p>

    `;

    return;

  }


  try {

    const respuesta =
      await fetch(API_MASCOTAS);


    if (!respuesta.ok) {

      throw new Error(
        "No se pudo conectar con PasteSheet"
      );

    }


    const resultado =
      await respuesta.json();


    const mascotas =
      resultado.datos ||
      resultado.data ||
      resultado;


    const animal =
      mascotas.find(

        mascota =>

          String(
            obtenerValor(
              mascota,
              ["ID", "Id", "id"]
            )
          ).trim() ===

          String(id).trim()

      );


    if (!animal) {

      contenido.innerHTML = `

        <p class="error">
          No se encontró una mascota con el código:
          ${id}
        </p>

      `;

      return;

    }


    /* DATOS */

    const nombre =
      obtenerValor(
        animal,
        ["Nombre", "nombre"]
      );


    const especie =
      obtenerValor(
        animal,
        ["Especie", "especie"]
      );


    const sexo =
      obtenerValor(
        animal,
        ["Sexo", "SEXO", "sexo"]
      );


    const caracteristicas =
      obtenerValor(
        animal,
        [
          "Características",
          "Caracteristicas",
          "características",
          "caracteristicas"
        ]
      );


    const foto =
      obtenerValor(
        animal,
        ["Foto", "foto"]
      );


    const audio =
      obtenerValor(
        animal,
        ["Audio", "audio"]
      );


    const telefono =
      obtenerValor(
        animal,
        [
          "Teléfono",
          "Telefono",
          "teléfono",
          "telefono"
        ]
      );


    const whatsapp =
      obtenerValor(
        animal,
        [
          "WhatsApp",
          "Whatsapp",
          "whatsapp"
        ]
      );


    const responsable =
      obtenerValor(
        animal,
        [
          "Responsable",
          "responsable"
        ]
      );


    const fecha =
      obtenerValor(
        animal,
        [
          "Fecha de registro",
          "Fecha de Registro",
          "fecha de registro",
          "Fecha",
          "fecha",
          "Marca temporal"
        ]
      );


    const estado =
      obtenerValor(
        animal,
        [
          "Estado",
          "estado"
        ]
      ) || "ACTIVO";


    /* PERFIL */

    let html = "";


    /* NOMBRE */

    html += `

      <h1>
        🐾 ${nombre}
      </h1>

      <div class="estado">
        ${estado}
      </div>

    `;


    /* FOTO */

    if (foto) {

      html += `

        <img
          class="foto"
          src="${convertirImagen(foto)}"
          alt="Foto de ${nombre}"
        >

      `;

    }


    /* ESPECIE */

    if (especie) {

      html += `

        <div class="dato">

          <strong>
            Especie:
          </strong>

          ${especie}

        </div>

      `;

    }


    /* SEXO */

    if (sexo) {

      html += `

        <div class="dato">

          <strong>
            Sexo:
          </strong>

          ${sexo}

        </div>

      `;

    }


    /* CARACTERÍSTICAS */

    if (caracteristicas) {

      html += `

        <div class="dato">

          <strong>
            Características:
          </strong>

          ${caracteristicas}

        </div>

      `;

    }


    /* RESPONSABLE */

    if (responsable) {

      html += `

        <div class="dato">

          <strong>
            Responsable:
          </strong>

          ${responsable}

        </div>

      `;

    }


    /* FECHA */

    if (fecha) {

      html += `

        <div class="dato">

          <strong>
            Fecha de registro:
          </strong>

          ${convertirFecha(fecha)}

        </div>

      `;

    }


    /* ID */

    html += `

      <div class="dato">

        <strong>
          ID:
        </strong>

        ${id}

      </div>

    `;


    /* TELÉFONO */

    if (telefono) {

      html += `

        <a
          class="boton telefono"
          href="tel:${telefono}"
        >

          📞 Llamar

        </a>

      `;

    }


    /* WHATSAPP */

    if (whatsapp) {

      let numeroWhatsApp =
        convertirWhatsApp(whatsapp);

      html += `

        <a
          class="boton whatsapp"
          href="https://wa.me/${numeroWhatsApp}"
          target="_blank"
        >

          💬 WhatsApp

        </a>

      `;

    }


    /* AUDIO */

    if (audio) {

      html += `

        <div class="audio">

          <strong>
            🔊 Sonido de ${nombre}
          </strong>

          <br><br>

          <audio controls>

            <source
              src="${audio}"
            >

            Tu navegador no puede reproducir
            este audio.

          </audio>

        </div>

      `;

    }


    contenido.innerHTML =
      html;


  } catch (error) {

    console.error(error);

    contenido.innerHTML = `

      <p class="error">

        No se pudo cargar la información
        de la mascota.

      </p>

    `;

  }

}


cargarMascota();

</script>

</body>
</html>
