<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HUELLITAS QR</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .contenedor {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 28px;
    }

    .subtitulo {
      color: #777;
      margin-bottom: 20px;
    }

    #foto {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 50%;
      display: none;
      margin: 20px auto;
      border: 5px solid #eee;
    }

    #nombre {
      font-size: 28px;
      margin: 15px 0;
    }

    .dato {
      text-align: left;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .dato strong {
      display: inline-block;
      width: 100px;
    }

    .boton {
      display: block;
      margin: 15px auto;
      padding: 13px 20px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      background: #333;
      max-width: 280px;
      cursor: pointer;
    }

    .oculto {
      display: none;
    }

    .error {
      color: #c00;
      font-weight: bold;
    }

    .pie {
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <h1>🐾 HUELLITAS QR</h1>

    <div class="subtitulo">
      Ficha de identificación
    </div>


    <div id="cargando">
      Cargando información...
    </div>


    <div id="perfil" class="oculto">

      <img
        id="foto"
        alt="Foto de la mascota"
      >


      <h2 id="nombre"></h2>


      <div class="dato">
        <strong>Especie:</strong>
        <span id="especie"></span>
      </div>


      <div class="dato">
        <strong>Color:</strong>
        <span id="color"></span>
      </div>


      <div class="dato">
        <strong>Código:</strong>
        <span id="codigo"></span>
      </div>


      <div class="dato">
        <strong>Estado:</strong>
        <span id="estado"></span>
      </div>


      <!-- AUDIO -->

      <a
        id="audio"
        class="boton oculto"
        target="_blank"
        rel="noopener noreferrer">

        🔊 Escuchar sonido

      </a>


      <!-- TELÉFONO -->

      <a
        id="telefono"
        class="boton oculto">

        📞 Llamar

      </a>


      <!-- WHATSAPP -->

      <a
        id="whatsapp"
        class="boton oculto"
        target="_blank"
        rel="noopener noreferrer">

        💬 WhatsApp

      </a>

    </div>


    <div
      id="error"
      class="error oculto">

      No encontramos información para esta mascota.

    </div>


    <div class="pie">

      HUELLITAS QR

    </div>

  </div>


<script>


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const API =
  "https://pastesheet.com/api/w4ajnkyn";


/* =====================================================
   OBTENER ID DE LA URL
===================================================== */

const parametros =
  new URLSearchParams(
    window.location.search
  );

const id =
  parametros.get("id");


/* =====================================================
   ELEMENTOS
===================================================== */

const cargando =
  document.getElementById("cargando");

const perfil =
  document.getElementById("perfil");

const error =
  document.getElementById("error");


/* =====================================================
   CONVERTIR ENLACE DE GOOGLE DRIVE
===================================================== */

function convertirGoogleDrive(enlace) {

  if (!enlace) {
    return "";
  }


  /*
    FORMATO 1

    https://drive.google.com/file/d/ID/view
  */

  let coincidencia =
    enlace.match(
      /\/d\/([^/]+)/
    );


  /*
    FORMATO 2

    https://drive.google.com/uc?export=view&id=ID

    FORMATO 3

    https://drive.google.com/thumbnail?id=ID
  */

  if (!coincidencia) {

    coincidencia =
      enlace.match(
        /[?&]id=([^&]+)/
      );

  }


  /*
    Si encontramos el ID
  */

  if (coincidencia) {

    const archivoID =
      coincidencia[1];


    /*
      Utilizamos thumbnail de Google Drive
    */

    return (
      "https://drive.google.com/thumbnail?id="
      + archivoID
      + "&sz=w1000"
    );

  }


  /*
    Si no es Google Drive,
    usamos el enlace original
  */

  return enlace;

}


/* =====================================================
   CARGAR MASCOTA
===================================================== */

async function cargarMascota() {


  /*
    Si no existe ID
  */

  if (!id) {

    cargando.style.display =
      "none";

    error.textContent =
      "No se encontró el código de la mascota.";

    error.classList.remove(
      "oculto"
    );

    return;

  }


  try {


    /* ================================================
       CONSULTAR PASTESHEET
    ================================================ */

    const respuesta =
      await fetch(API);


    /*
      Convertir respuesta a JSON
    */

    const resultado =
      await respuesta.json();


    /*
      Buscar mascota
    */

    const mascota =
      resultado.data.find(

        animal =>

          String(animal.ID)
            .trim()
            .toUpperCase()

          ===

          id
            .trim()
            .toUpperCase()

      );


    /*
      Si no existe
    */

    if (!mascota) {

      cargando.style.display =
        "none";

      error.textContent =
        "No encontramos información para esta mascota.";

      error.classList.remove(
        "oculto"
      );

      return;

    }


    /* ================================================
       DATOS
    ================================================ */

    document.getElementById(
      "nombre"
    ).textContent =
      mascota.Name || "";


    document.getElementById(
      "especie"
    ).textContent =
      mascota.Species || "";


    document.getElementById(
      "color"
    ).textContent =
      mascota.Color || "";


    document.getElementById(
      "codigo"
    ).textContent =
      mascota.ID || "";


    document.getElementById(
      "estado"
    ).textContent =
      mascota.Status || "ACTIVO";


    /* ================================================
       FOTO
    ================================================ */

    if (mascota.Photo) {


      const foto =
        document.getElementById(
          "foto"
        );


      const enlaceFoto =
        convertirGoogleDrive(
          mascota.Photo
        );


      /*
        Colocar imagen
      */

      foto.src =
        enlaceFoto;


      /*
        Si carga correctamente
      */

      foto.onload =
        function() {

          foto.style.display =
            "block";

        };


      /*
        Si falla
      */

      foto.onerror =
        function() {

          console.log(
            "No se pudo cargar la fotografía."
          );

          foto.style.display =
            "none";

        };

    }


    /* ================================================
       AUDIO
    ================================================ */

    if (mascota.Audio) {

      const audio =
        document.getElementById(
          "audio"
        );


      audio.href =
        mascota.Audio;


      audio.classList.remove(
        "oculto"
      );

    }


    /* ================================================
       TELÉFONO
    ================================================ */

    if (mascota.Phone) {

      const telefono =
        document.getElementById(
          "telefono"
        );


      telefono.href =
        "tel:" + mascota.Phone;


      telefono.classList.remove(
        "oculto"
      );

    }


    /* ================================================
       WHATSAPP
    ================================================ */

    if (mascota.WhatsApp) {

      const whatsapp =
        document.getElementById(
          "whatsapp"
        );


      whatsapp.href =
        mascota.WhatsApp;


      whatsapp.classList.remove(
        "oculto"
      );

    }


    /* ================================================
       MOSTRAR PERFIL
    ================================================ */

    cargando.style.display =
      "none";


    perfil.classList.remove(
      "oculto"
    );


  }


  catch (e) {


    console.error(e);


    cargando.style.display =
      "none";


    error.textContent =
      "No se pudo cargar la información.";


    error.classList.remove(
      "oculto"
    );

  }

}


/* =====================================================
   INICIAR
===================================================== */

cargarMascota();


</script>


</body>

</html>
