<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Huellitas QR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f5;
      color: #333;
    }

    .banner {
      width: 100%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      line-height: 0;
    }

    .banner img {
      width: 100%;
      height: auto;
      display: block;
    }

    .pagina {
      max-width: 620px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .tarjeta {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
      text-align: center;
    }

    #foto {
      width: 100%;
      height: 310px;
      object-fit: cover;
      border-radius: 15px;
      display: block;
      margin-bottom: 20px;
      background: #eee;
    }

    .campo {
      margin-bottom: 14px;
      text-align: left;
    }

    .campo strong {
      display: block;
      font-size: 14px;
      color: #777;
      margin-bottom: 4px;
    }

    .campo span {
      display: block;
      font-size: 18px;
      color: #222;
    }

    .botones {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    #codigo {
      margin-top: 22px;
      font-weight: bold;
      font-size: 16px;
      color: #555;
    }

    #estado {
      margin-top: 8px;
      font-weight: bold;
      color: #1b8a3a;
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }

    @media (max-width: 600px) {
      .pagina {
        margin: 15px auto;
      }

      .tarjeta {
        padding: 15px;
      }

      #foto {
        height: 270px;
      }

      .campo span {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- BANNER -->
  <div class="banner">
    <img
      src="https://tushuellitasqr-pixel.github.io/huellitasqr/banner.jpg"
      alt="Huellitas QR"
    >
  </div>

  <div class="pagina">

    <div class="tarjeta">

      <!-- FOTO -->
      <img id="foto" src="" alt="Foto de la mascota">

      <!-- INFORMACIÓN -->
      <div class="campo">
        <strong>Nombre</strong>
        <span id="nombre"></span>
      </div>

      <div class="campo">
        <strong>Especie</strong>
        <span id="especie"></span>
      </div>

      <div class="campo">
        <strong>Color y características</strong>
        <span id="color"></span>
      </div>

      <div class="campo" id="campoResponsable">
        <strong>Responsable</strong>
        <span id="responsable"></span>
      </div>

      <div class="campo" id="campoFecha">
        <strong>Fecha de registro</strong>
        <span id="fecha"></span>
      </div>

      <!-- BOTONES -->
      <div class="botones">

        <button id="btnAudio" onclick="reproducirAudio()">
          🔊 Escuchar sonido
        </button>

        <button id="btnTelefono" onclick="llamar()">
          📞 Llamar
        </button>

        <button id="btnWhatsApp" onclick="whatsapp()">
          💬 WhatsApp
        </button>

      </div>

      <!-- ID -->
      <div id="codigo"></div>

      <!-- ESTADO -->
      <div id="estado"></div>

      <footer>
        Huellitas QR
      </footer>

    </div>

  </div>

  <script>

    const API = "https://pastesheet.com/api/rbgtavcc";

    let mascotaActual = null;
    let audioMascota = null;
    let reproductorAudio = null;


    /* =========================
       CONVERTIR FOTO DE GOOGLE DRIVE
       ========================= */

    function convertirGoogleDrive(url) {

      if (!url) return "";

      const coincidencia = url.match(/[?&]id=([^&]+)/);

      if (coincidencia) {

        return "https://drive.google.com/thumbnail?id="
          + coincidencia[1]
          + "&sz=w1200";

      }

      return url;
    }


    /* =========================
       CONVERTIR AUDIO DE GOOGLE DRIVE
       ========================= */

    function convertirAudioGoogleDrive(url) {

      if (!url) return "";

      const coincidencia = url.match(/[?&]id=([^&]+)/);

      if (coincidencia) {

        return "https://drive.google.com/uc?export=media&id="
          + coincidencia[1];

      }

      return url;
    }


    /* =========================
       FORMATEAR FECHA
       ========================= */

    function formatearFecha(valor) {

      if (!valor) return "";

      const numero = Number(valor);

      if (!isNaN(numero)) {

        const fecha = new Date(
          Math.round(
            (numero - 25569) * 86400 * 1000
          )
        );

        return fecha.toLocaleDateString("es-EC");
      }

      return valor;
    }


    /* =========================
       OBTENER ID DE LA URL
       ========================= */

    function obtenerID() {

      const parametros = new URLSearchParams(
        window.location.search
      );

      return parametros.get("id");
    }


    /* =========================
       CARGAR MASCOTA
       ========================= */

    async function cargarMascota() {

      const id = obtenerID();

      if (!id) {

        document.getElementById("nombre").textContent =
          "No se encontró el ID de la mascota.";

        return;
      }

      try {

        const respuesta = await fetch(API);

        if (!respuesta.ok) {
          throw new Error("No se pudo conectar con la base de datos.");
        }

        const datos = await respuesta.json();

        const mascota = datos.data.find(
          item => item.ID === id
        );

        if (!mascota) {

          document.getElementById("nombre").textContent =
            "Mascota no encontrada.";

          return;
        }

        mascotaActual = mascota;

        /* FOTO */

        const foto = convertirGoogleDrive(
          mascota["Foto de la mascota"]
        );

        document.getElementById("foto").src = foto;


        /* NOMBRE */

        document.getElementById("nombre").textContent =
          mascota["Nombre de la mascota"] || "";


        /* ESPECIE */

        document.getElementById("especie").textContent =
          mascota["Especie"] || "";


        /* COLOR */

        document.getElementById("color").textContent =
          mascota["Color y características"] || "";


        /* RESPONSABLE */

        if (mascota["Nombre del responsable"]) {

          document.getElementById("responsable").textContent =
            mascota["Nombre del responsable"];

        } else {

          document.getElementById("campoResponsable").style.display =
            "none";

        }


        /* FECHA */

        if (mascota["Fecha de registro"]) {

          document.getElementById("fecha").textContent =
            formatearFecha(
              mascota["Fecha de registro"]
            );

        } else {

          document.getElementById("campoFecha").style.display =
            "none";

        }


        /* AUDIO */

        if (mascota["Audio"]) {

          audioMascota =
            convertirAudioGoogleDrive(
              mascota["Audio"]
            );

          document.getElementById("btnAudio").style.display =
            "inline-block";

        } else {

          document.getElementById("btnAudio").style.display =
            "none";

        }


        /* TELÉFONO */

        if (mascota["Teléfono de contacto"]) {

          document.getElementById("btnTelefono").style.display =
            "inline-block";

        } else {

          document.getElementById("btnTelefono").style.display =
            "none";

        }


        /* WHATSAPP */

        if (mascota["WhatsApp"]) {

          document.getElementById("btnWhatsApp").style.display =
            "inline-block";

        } else {

          document.getElementById("btnWhatsApp").style.display =
            "none";

        }


        /* ID */

        document.getElementById("codigo").textContent =
          "ID: " + mascota.ID;


        /* ESTADO */

        document.getElementById("estado").textContent =
          mascota["Estado"] || "";

      }

      catch (error) {

        console.error(error);

        document.getElementById("nombre").textContent =
          "No se pudo cargar la información.";

      }

    }


    /* =========================
       REPRODUCIR AUDIO
       ========================= */

    function reproducirAudio() {

      if (!audioMascota) {

        alert("Esta mascota no tiene un audio registrado.");

        return;
      }


      /* Si ya existe un reproductor, detenerlo */

      if (reproductorAudio) {

        reproductorAudio.pause();

        reproductorAudio.currentTime = 0;

      }


      /* Crear reproductor */

      reproductorAudio =
        new Audio(audioMascota);


      reproductorAudio.preload = "auto";


      /* REPRODUCCIÓN DIRECTA */

      reproductorAudio.play()
        .then(() => {

          console.log("Audio reproduciéndose");

        })
        .catch(error => {

          console.error(
            "No se pudo reproducir el audio:",
            error
          );

          alert(
            "No se pudo reproducir el audio. Verifica que el archivo de audio de Google Drive esté compartido como 'Cualquier persona con el enlace'."
          );

        });

    }


    /* =========================
       LLAMAR
       ========================= */

    function llamar() {

      if (
        !mascotaActual ||
        !mascotaActual["Teléfono de contacto"]
      ) {
        return;
      }

      window.location.href =
        "tel:" +
        mascotaActual["Teléfono de contacto"];

    }


    /* =========================
       WHATSAPP
       ========================= */

    function whatsapp() {

      if (
        !mascotaActual ||
        !mascotaActual["WhatsApp"]
      ) {
        return;
      }

      const numero =
        mascotaActual["WhatsApp"];

      const mensaje =
        "Hola, me comunico por " +
        mascotaActual["Nombre de la mascota"] +
        " mediante Huellitas QR.";

      window.open(
        "https://wa.me/" +
        numero +
        "?text=" +
        encodeURIComponent(mensaje),
        "_blank"
      );

    }


    /* =========================
       INICIAR
       ========================= */

    cargarMascota();

  </script>

</body>
</html>
