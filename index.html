<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HUELLITAS QR</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #333;
    }

    .contenedor {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #333;
    }

    .logo {
      font-size: 45px;
      margin-bottom: 10px;
    }

    #foto {
      width: 100%;
      max-width: 350px;
      max-height: 350px;
      object-fit: cover;
      border-radius: 15px;
      margin: 15px auto;
      display: none;
    }

    .dato {
      text-align: left;
      margin: 12px 0;
      padding: 12px;
      background: #f7f7f7;
      border-radius: 10px;
    }

    .dato strong {
      display: block;
      margin-bottom: 5px;
    }

    .botones {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .boton {
      display: block;
      padding: 13px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border: none;
    }

    .telefono {
      background: #333;
    }

    .whatsapp {
      background: #25D366;
    }

    .audio {
      background: #6c5ce7;
    }

    .oculto {
      display: none !important;
    }

    .error {
      color: #b00020;
      font-weight: bold;
      line-height: 1.5;
    }

    .codigo {
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }

    .estado {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 20px;
      background: #dff5e5;
      color: #247a3b;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="logo">🐾</div>

    <h1>HUELLITAS QR</h1>

    <div id="contenido">
      Cargando información...
    </div>

  </div>


  <script>

    /* =====================================================
       CONEXIÓN CON PASTESHEET
       ===================================================== */

    const API_MASCOTAS =
      "https://pastesheet.com/api/rbgtavcc";


    /* =====================================================
       CONVERTIR ENLACES DE GOOGLE DRIVE
       ===================================================== */

    function convertirGoogleDrive(url) {

      if (!url) {
        return "";
      }

      url = url.trim();

      const coincidencia =
        url.match(/[?&]id=([^&]+)/);

      if (coincidencia) {

        return "https://drive.google.com/thumbnail?id="
          + coincidencia[1]
          + "&sz=w1000";

      }

      const coincidencia2 =
        url.match(/\/d\/([^/]+)/);

      if (coincidencia2) {

        return "https://drive.google.com/thumbnail?id="
          + coincidencia2[1]
          + "&sz=w1000";

      }

      return url;
    }


    /* =====================================================
       FORMATEAR FECHA
       ===================================================== */

    function formatearFecha(valor) {

      if (!valor) {
        return "";
      }

      const texto = String(valor).trim();

      /*
       Formato DD/MM/YYYY
      */

      if (
        /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(texto)
      ) {

        return texto;

      }


      /*
       Fecha ISO
      */

      if (texto.includes("-")) {

        const fecha =
          new Date(texto);

        if (!isNaN(fecha.getTime())) {

          return fecha.toLocaleDateString(
            "es-EC"
          );

        }

      }


      /*
       Fecha serial de Google Sheets
      */

      const numero =
        Number(texto);

      if (!isNaN(numero)) {

        const fechaBase =
          new Date(Date.UTC(1899, 11, 30));

        fechaBase.setUTCDate(
          fechaBase.getUTCDate()
          + Math.floor(numero)
        );

        return fechaBase.toLocaleDateString(
          "es-EC",
          {
            timeZone: "UTC"
          }
        );

      }

      return texto;
    }


    /* =====================================================
       OBTENER ID DE LA URL
       ===================================================== */

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    const idBuscado =
      (parametros.get("id") || "")
      .trim()
      .toUpperCase();


    /* =====================================================
       CARGAR MASCOTA
       ===================================================== */

    async function cargarMascota() {

      const contenido =
        document.getElementById("contenido");


      if (!idBuscado) {

        contenido.innerHTML = `
          <p class="error">
            No se indicó el código de la mascota.
          </p>
        `;

        return;
      }


      try {

        const respuesta =
          await fetch(
            API_MASCOTAS
            + "?_="
            + Date.now(),
            {
              cache: "no-store"
            }
          );


        if (!respuesta.ok) {

          throw new Error(
            "No se pudo conectar con la base de datos."
          );

        }


        const datosMascotas =
          await respuesta.json();


        const mascotas =
          datosMascotas.data || [];


        const mascota =
          mascotas.find(
            animal =>
              String(animal.ID || "")
              .trim()
              .toUpperCase()
              === idBuscado
          );


        if (!mascota) {

          contenido.innerHTML = `
            <p class="error">
              No se encontró una mascota
              con el código ${idBuscado}
            </p>
          `;

          return;
        }


        /* =================================================
           DATOS DE LA MASCOTA
           ================================================= */

        const nombre =
          mascota["Nombre de la mascota"] || "";

        const especie =
          mascota["Especie"] || "";

        const color =
          mascota["Color y características"] || "";

        const responsable =
          mascota["Nombre del responsable"] || "";

        const telefono =
          mascota["Teléfono de contacto"] || "";

        const whatsapp =
          mascota["WhatsApp"] || "";

        const foto =
          mascota["Foto de la mascota"] || "";

        const audio =
          mascota["Audio"] || "";

        const fecha =
          mascota["Fecha de registro"] || "";

        const estado =
          mascota["Estado"] || "";


        /* =================================================
           MOSTRAR FOTO
           ================================================= */

        let fotoHTML = "";

        if (foto) {

          const fotoConvertida =
            convertirGoogleDrive(foto);

          fotoHTML = `
            <img
              id="foto"
              src="${fotoConvertida}"
              alt="Foto de ${nombre}"
              style="display:block;"
            >
          `;

        }


        /* =================================================
           RESPONSABLE
           ================================================= */

        let responsableHTML = "";

        if (responsable) {

          responsableHTML = `
            <div class="dato">
              <strong>Responsable</strong>
              ${responsable}
            </div>
          `;

        }


        /* =================================================
           FECHA
           ================================================= */

        let fechaHTML = "";

        if (fecha) {

          fechaHTML = `
            <div class="dato">
              <strong>Fecha de registro</strong>
              ${formatearFecha(fecha)}
            </div>
          `;

        }


        /* =================================================
           ESTADO
           ================================================= */

        let estadoHTML = "";

        if (estado) {

          estadoHTML = `
            <span class="estado">
              ${estado}
            </span>
          `;

        }


        /* =================================================
           BOTÓN TELÉFONO
           ================================================= */

        let telefonoHTML = "";

        if (telefono) {

          telefonoHTML = `
            <a
              class="boton telefono"
              href="tel:${telefono}"
            >
              📞 Llamar
            </a>
          `;

        }


        /* =================================================
           BOTÓN WHATSAPP
           ================================================= */

        let whatsappHTML = "";

        if (whatsapp) {

          let numeroWhatsApp =
            String(whatsapp)
            .replace(/\D/g, "");


          /*
           Si el número ecuatoriano empieza
           con 0, se reemplaza por 593
          */

          if (
            numeroWhatsApp.startsWith("0")
          ) {

            numeroWhatsApp =
              "593"
              + numeroWhatsApp.substring(1);

          }


          /*
           Si tiene 9 dígitos y empieza
           por 9, agregamos 593
          */

          if (
            numeroWhatsApp.length === 9
            &&
            numeroWhatsApp.startsWith("9")
          ) {

            numeroWhatsApp =
              "593"
              + numeroWhatsApp;

          }


          whatsappHTML = `
            <a
              class="boton whatsapp"
              href="https://wa.me/${numeroWhatsApp}"
              target="_blank"
            >
              💬 WhatsApp
            </a>
          `;

        }


        /* =================================================
           BOTÓN AUDIO
           ================================================= */

        let audioHTML = "";

        if (audio) {

          audioHTML = `
            <a
              class="boton audio"
              href="${audio}"
              target="_blank"
            >
              🔊 Escuchar audio
            </a>
          `;

        }


        /* =================================================
           MOSTRAR TODO
           ================================================= */

        contenido.innerHTML = `

          ${fotoHTML}

          <div class="dato">
            <strong>Nombre</strong>
            ${nombre}
          </div>

          <div class="dato">
            <strong>Especie</strong>
            ${especie}
          </div>

          <div class="dato">
            <strong>Color y características</strong>
            ${color}
          </div>

          ${responsableHTML}

          ${fechaHTML}

          ${estadoHTML}

          <div class="botones">

            ${audioHTML}

            ${telefonoHTML}

            ${whatsappHTML}

          </div>

          <div class="codigo">
            Código: ${idBuscado}
          </div>

        `;

      }


      catch (error) {

        console.error(error);

        contenido.innerHTML = `
          <p class="error">
            No se pudo cargar la información
            de la mascota.
          </p>
        `;

      }

    }


    /* =====================================================
       INICIAR
       ===================================================== */

    cargarMascota();

  </script>

</body>
</html>
